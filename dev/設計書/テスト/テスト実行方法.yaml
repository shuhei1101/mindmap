title: "テスト実行方法"
layers:
  - name: 単体テスト（バック）
    run_all: |-
      ```bash
      pytest tests/unit
      ```
    description: pytest で、スクリプトの関数を `tests/unit/scripts/` から直接呼んで確かめる。`conftest.py` が `skills/mindmap/scripts` を `sys.path` に足すので、各モジュールを `import store` のように同じ名前で読む。ファイルの読み書きは `tmp_path` の一時フォルダで行い、利用者の環境は触らない。
    prerequisites:
      - Python 3.12 以上と pytest
      - PyYAML 5.1 以上と jsonschema 4.18.0 以上が、テストを動かす Python に入っている
      - 実行はリポジトリの直下で行う
    run_one:
      label: ファイル
      command: |-
        ```bash
        pytest {テストファイルパス}
        ```
  - name: 単体テスト（フロント）
    run_all: 未確定
  - name: 結合テスト（バック）
    run_all: |-
      ```bash
      pytest tests/integration
      ```
    description: pytest で、実際の Claude Code の CLI（`claude plugin ...`）を呼んでインターフェース定義の流れを確かめる。Mock は使わない。
    prerequisites:
      - Python 3.12 以上と pytest
      - Claude Code 2.1.287 以上（`claude` が PATH にある）
      - 実行はリポジトリの直下で行う。設定のフォルダは conftest が `CLAUDE_CONFIG_DIR` にテストごとの空の一時フォルダを渡して差し替えるため、利用者の環境を汚さない
    run_one:
      label: ファイル
      command: |-
        ```bash
        pytest {テストファイルパス}
        ```
  - name: 結合テスト（フロント）
    run_all: 未確定
  - name: E2E テスト
    run_all: |-
      ```bash
      pytest tests/e2e
      ```
    description: pytest で、実際の Claude Code の CLI（`claude plugin ...`）を使い、シナリオ設計書の利用者の操作を通しで確かめる。Mock は使わない。
    prerequisites:
      - Python 3.12 以上と pytest
      - Claude Code 2.1.287 以上（`claude` が PATH にある）
      - 実行はリポジトリの直下で行う。マーケットプレイスにはこの作業ツリーの直下を渡す。設定のフォルダは conftest が `CLAUDE_CONFIG_DIR` にテストごとの空の一時フォルダを渡して差し替えるため、利用者の環境を汚さない
    run_one:
      label: シナリオ
      command: |-
        ```bash
        pytest {シナリオのテストファイルパス}
        ```
  - name: 外部疎通テスト
    run_all: 未確定
