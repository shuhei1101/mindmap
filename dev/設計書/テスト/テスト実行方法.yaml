title: "テスト実行方法"
layers:
  - name: 単体テスト（バック）
    run_all: 未確定
  - name: 単体テスト（フロント）
    run_all: 未確定
  - name: 結合テスト（バック）
    run_all: |-
      ```bash
      pytest tests/integration
      ```
    description: pytest で、実際の Claude Code の CLI（`claude plugin ...`）を呼んでインターフェース定義の流れを確かめる。Mock は使わない。
    prerequisites:
      - Python 3.12 以上と pytest
      - Claude Code 2.1.287 以上（`claude` が PATH にある）
      - 実行はリポジトリの直下で行う。設定のフォルダは conftest が `CLAUDE_CONFIG_DIR` にテストごとの空の一時フォルダを渡して差し替えるため、利用者の環境を汚さない
    run_one:
      label: ファイル
      command: |-
        ```bash
        pytest {テストファイルパス}
        ```
  - name: 結合テスト（フロント）
    run_all: 未確定
  - name: E2E テスト
    run_all: 未確定
  - name: 外部疎通テスト
    run_all: 未確定
