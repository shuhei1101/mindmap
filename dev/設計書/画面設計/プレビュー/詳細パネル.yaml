title: "詳細パネル"
elements:
  - name: 戻る・進む
    kind: button
    position: 見出し
    description: パネルと全画面の中で移ってきた項目を行き来する（ブラウザの戻る・進むと同じ履歴）
    label: ← →
    enabled_when: その向きに見てきた項目がある
  - name: タイトル
    kind: heading
    position: 見出し
    description: 項目の ID・タイトル・状態。納品物の資料はタイトルの右に余白を空けて納品物の印を置く（状態の横に並べない）
    io: 表示
    source: プレビューを開く.id の項目
  - name: 全画面に切り替える
    kind: button
    position: 見出し
    description: 詳細の全画面を開く（履歴に積まない）
  - name: 閉じる
    kind: button
    position: 見出し
    description: パネルを閉じる。Esc でも閉じる
  - name: 案
    kind: list
    description: 検討事項の案をカードの縦並びで出し、採用 / 不採用と理由を出す
    io: 表示
    source: プレビューを開く.mindmap-data.decisions[].options
    visible_when: 検討事項で案を持つ
  - name: 本文
    kind: article
    description: 本文の Markdown を marked で描き DOMPurify で無害化して差し込む。mermaid の図は SVG に描き、「拡大して見る」「Raw」「コピー」を置く。ライブラリが読めないときは読めなかったライブラリの知らせと原文
    io: 表示
    source: プレビューを開く.mindmap-data.bodies[{項目の body}]
    visible_when: 項目が `body` を持つ
  - name: 図を拡大して見る
    kind: button
    position: 本文 > 図
    description: 図の拡大を開く
    label: 拡大して見る
  - name: 図の Raw
    kind: button
    position: 本文 > 図
    description: 図と mermaid の原文を切り替える（`aria-pressed`）
    label: Raw
  - name: 図のコピー
    kind: button
    position: 本文 > 図
    description: mermaid の原文をクリップボードに写す
    label: コピー
  - name: 関係する項目
    kind: list
    description: 前提・後続の項目・関連タスク・経緯・関連・この項目を参照している項目。押すとその項目へ移り、履歴に積む。各行の先頭の ID のボタンは、見えている枠を縦横 24px（`--target-min`）以上にする
    io: 表示
    source: プレビューを開く.mindmap-data（`depends_on`・`for`・`related`・`sources` とその逆向き）
    visible_when: その種類の項目が 1 件以上
lead: 項目 1 件の中身を本文の右に出すパネル。幅 1100px 以上（マップは 901px 以上）は本文を寄せて並べ、それより狭いと本文に重ねる。
mock: dev/mock/pages/detail-panel/63/standard/index.html
test_file: tests/integration/preview/test_detail_panel_screen.py
