title: "記録の表"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.js#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.name
      - name: tabs
        value: 概要と同じ
      - name: current
        value: プレビューを開く.tab（research・terms・notes・logs）
      - name: theme
        value: 概要と同じ
    description: 全ての画面で共通の帯
    visible_when: 常時
