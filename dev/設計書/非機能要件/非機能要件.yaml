    source_kind: 実行基盤の制限
    value: 2.0.12 以上
    rationale: マニフェストで使うのは `marketplace.json` の `name`・`owner`・`plugins` と `plugin.json` の `name`・`description`・`author` だけで、プラグインの仕組みが入った版から使える
