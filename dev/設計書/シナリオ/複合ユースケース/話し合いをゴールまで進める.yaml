title: ""
scenarios:
  - name: 正常シナリオ（新しい話し合い）
    setup:
      - name: Mock
        description: なし（プラグインを読み込んだ実際の Claude Code でスキルを動かし、実際の Python でスクリプトを起動する）
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema が入っている
      - name: 空のワークスペースのフォルダ
        description: まだ `mindmap.yaml` を持たないフォルダ
      - name: 利用者の発言
        description: 分野がシステム開発と分かる最初の発言と、決め事・派生する問い・外部ライブラリの選定・採用する案の切り替えを含む発言の並び
        notes: 'ゴールは進め方ガイドの既定（システム開発: インターフェースまで）'
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|ワークスペースのフォルダを渡して /mindmap:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（新しいワークスペース）])
        S1 -->|分野・最上位の軸の呼び名・フェーズ・カテゴリー・ゴールを決めて作る +<br>話し合いを進めるスキルへ渡す| T1([発言の取り込み:正常シナリオ])
        T1 -->|決め事と派生の検討事項・タスクを積む| H1([ヒアリング:正常シナリオ])
        H1 -->|前提が揃った未決定を 1 ラウンドで聞き、答えを取り込む| R1([リサーチ:正常シナリオ])
        R1 -->|確認を取ってサブエージェントで調べ、調査を検討事項に繋ぐ| C1([方針転換:正常シナリオ])
        C1 -->|採用する案を切り替え、影響を要見直しにして見直しのタスクを積む| P1([プレビューを開く:正常シナリオ])
        P1 -->|記録を書き出して開く| G1([ゴール判定:正常シナリオ（ゴールに届いた）])
        G1 --> DONE([確定した検討事項と成果物が handoff/ に書き出された状態])

        click S1 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ新しいワークスペース"
        click T1 "../単一ユースケース/発言の取り込み.yaml#正常シナリオ"
        click H1 "../単一ユースケース/ヒアリング.yaml#正常シナリオ"
        click R1 "../単一ユースケース/リサーチ.yaml#正常シナリオ"
        click C1 "../単一ユースケース/方針転換.yaml#正常シナリオ"
        click P1 "../単一ユースケース/プレビューを開く.yaml#正常シナリオ"
        click G1 "../単一ユースケース/ゴール判定.yaml#正常シナリオゴールに届いた"
      ```
    expected:
      - '`mindmap.yaml` に、分野・最上位の軸の呼び名・フェーズ・カテゴリー・ゴールが入っている'
      - 利用者の発言から、決め事を持つ検討事項・派生の検討事項・タスクが記録されている
      - リサーチで書いた調査が、元の検討事項と `related` でつながっている
      - 方針転換で切り替えた検討事項に依存する検討事項が要見直しになり、見直しのタスクがある
      - 会話ログが会話の回数ぶん書き足されている
      - '`handoff/` に、確定した検討事項と成果物の資料が書き出されている'
      - '`check` が参照切れと、YAML と Markdown のずれを 0 件で返す'
      - '`preview.html` が最後の編集より後に書き出されている'
  - name: 正常シナリオ（続きから再開）
    setup:
      - name: Mock
        description: なし（プラグインを読み込んだ実際の Claude Code でスキルを動かし、実際の Python でスクリプトを起動する）
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema が入っている
      - name: 途中まで進んだワークスペース
        description: 要見直しの検討事項・進行中のタスク・前提が揃った未決定を持つワークスペース
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|途中まで進んだワークスペースのフォルダを渡して /mindmap:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S1 -->|要見直し・進行中・再開可能・次の候補と続きの推奨を出す +<br>話し合いを進めるスキルへ渡す| C1([方針転換:正常シナリオ])
        C1 -->|要見直しの検討事項を見直して決め直す| T1([発言の取り込み:正常シナリオ])
        T1 -->|続きの番号で項目を足す| G1([ゴール判定:正常シナリオ（ゴールに届いた）])
        G1 --> DONE([確定した検討事項と成果物が handoff/ に書き出された状態])

        click S1 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ既存のワークスペース"
        click C1 "../単一ユースケース/方針転換.yaml#正常シナリオ"
        click T1 "../単一ユースケース/発言の取り込み.yaml#正常シナリオ"
        click G1 "../単一ユースケース/ゴール判定.yaml#正常シナリオゴールに届いた"
      ```
    expected:
      - セットアップの応答に、要見直し・進行中・再開可能・次の候補と、続きの推奨がある
      - 既存の項目の ID が変わらず、新しい項目は続きの番号で足されている
      - '`handoff/` に引き渡しの資料が書き出されている'
  - name: 異常シナリオ（依存が足りない）
    setup:
      - name: Mock
        description: なし（プラグインを読み込んだ実際の Claude Code でスキルを動かし、実際の Python でスクリプトを起動する）
      - name: 依存が足りない環境
        description: スキル専用の仮想環境が無い
      - name: 空のワークスペースのフォルダ
        description: まだ `mindmap.yaml` を持たないフォルダ
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|/mindmap:setup を呼ぶ| S1([話し合いのセットアップ:異常シナリオ（依存が足りない）])
        S1 --> DONE([依存をそろえるコマンドが示され、ワークスペースに何も書かれていない状態])

        click S1 "../単一ユースケース/話し合いのセットアップ.yaml#異常シナリオ依存が足りない"
      ```
    expected:
      - 応答に、`check-env` が返した依存をそろえるコマンドがある
      - ワークスペースのフォルダに何も書かれていない
lead: 利用者がセットアップのスキルでワークスペースを用意し、話し合いを進めるスキルで発言の取り込み・ヒアリング・リサーチ・方針転換を重ね、ゴール判定で引き渡しの資料を書き出すまでの複合ユースケース。
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 抽象と具体を行き来する発言をそのまま話しても、決め事・派生する問い・調べものが記録に残り、ゴールまで迷わず進める
  - name: 引き渡し先
    interest: ゴール判定で書き出した資料だけを読めば、決まったことと成果物が分かる
trigger: 利用者が Claude Code でセットアップのスキル（`/mindmap:setup`）を呼ぶ
preconditions:
  - プラグイン mindmap がインストールされている
success_guarantee: ゴールに届いた検討事項と成果物を利用者が確定し、`handoff/` に引き渡しの資料が書き出されている。ワークスペースの YAML はどの時点でもスキーマに合い、`preview.html` は最後の編集の後に書き出し直されている。
minimal_guarantee: 依存が足りないときは、ワークスペースに何も書かずに止まる。途中で話し合いを終えても、それまでに記録した項目と会話ログはワークスペースに残り、次のセットアップで続きから再開できる。
frequency: 1 つの話し合いにつき、セットアップ 1 回と、ゴールまでの数回〜数十回の会話
priority: 高
notes:
  スキルの呼び名: セットアップのスキルは `setup`（`/mindmap:setup`）。話し合いを進めるスキルの名前は、ユーザーの確認を取って決める。それまでこの設計書では「話し合いを進めるスキル」と呼ぶ
  ステップとの対応: 単一ユースケースはスキルのステップに 1 対 1 で当たる（セットアップ → 話し合いのセットアップ、取り込み → 発言の取り込み、プレビュー → プレビューを開く）。どのステップも、ワークスペースを編集したら最後に `build` を流す
  対応テストファイル: '`tests/e2e/複合ユースケース/test_discussion_to_goal.py`（E2E テスト作成で置き、`test_file` に書く）'
