title: ""
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実際のブラウザで `preview.html` を開き、描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 対象 1・カテゴリー 2・フェーズ 3 にまたがる検討事項（未決定・決定済み・要見直し・保留を含み、依存でつながる）と、検討事項を進めるタスク（進行中を含む）・調査・資料（成果物を含み、本文の Markdown に mermaid の図を持つ）・用語・メモ・会話ログ
        notes: 要見直しの検討事項 D-3 は、前提の D-1 と後続の D-5 を持ち、タスク T-2 が進める
      - name: 書き出し
        description: 記録を書き出した `preview.html`
    flow: |-
      ```mermaid
      flowchart TD
        subgraph 掴む[状況を掴む]
          A[プレビューを開く] --> B[概要を見る]
        end
        subgraph 探す[項目を探す]
          C[項目を検索する]
          D[検討事項をマップで辿る]
          E[タスクをボードで見る]
          F[資料を読む]
          G[項目を表で絞り込む]
        end
        subgraph 読む[詳細を読む]
          H[項目の詳細を読む]
        end
        subgraph 関係[関係を見る]
          I[つながりを辿る]
          J[URL を開き直す]
        end
        B --> C
        B --> D
        B --> E
        B --> F
        D --> G
        C --> H
        D --> H
        E --> H
        F --> H
        G --> H
        H --> I
        I --> H
        H --> J
      ```
    expected:
      - 概要の要見直しのタイルに D-3 があり、押すと D-3 の詳細パネルが開く
      - D-3 の詳細パネルに、前提の D-1・後続の D-5・関連タスクの T-2 が出る
      - マップで D-3 を押すと、D-3 から根までの枝と、D-1・D-5 への依存の線が強調される
      - つながりで D-3 を押すと、D-3 の詳細パネルが開く
      - そのときの URL を新しいタブで開くと、つながりの画面と D-3 の詳細パネルが開く
      - 画面を操作した後も、ワークスペースの YAML と `preview.html` の中身が開く前と同じ
    test: test_normal
    notes:
      単一ユースケースの箱: 箱は、単一ユースケース設計で起こす単一ユースケース（概要を見る・項目を検索する・検討事項をマップで辿る・タスクをボードで見る・資料を読む・項目を表で絞り込む・項目の詳細を読む・つながりを辿る）に当たる。単一ユースケースを書いた後に `uses` で指す。プレビューを開くことと URL を開き直すことは、利用者がブラウザでファイルを開く操作で、単一ユースケースを持たない
      シナリオの判定: 判定フローチャート『シナリオ』で、新規に複合ユースケース（単一価値シナリオ）とした。達成価値は「利用者が話し合いの状況を掴み、気になる項目の中身と関係を読める」、主要フェーズは 4（掴む・探す・読む・関係を見る）、操作ノードは 10。利用者 1 人が記録を読むだけで、複数の種類の項目の交差は価値の中核ではない。画面をまたいだ遷移と URL のハッシュの復元は、単一ユースケースの E2E では通しで確かめられない
lead: 利用者が、書き出したプレビューを開き、概要で話し合いの状況を掴んでから、気になる項目を探して詳細と関係を読む複合ユースケース。
issue: 5
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: ファイルを開くだけで、次に何を決めるか・何が進んでいるか・項目どうしがどうつながっているかを読める
trigger: 利用者が、話し合いを再開する前や途中で、記録の全体を見返したくなる
preconditions:
  - ワークスペースに記録があり、プレビューを書き出してある
  - ブラウザが CDN へ HTTPS で届く
success_guarantee: 利用者が開いた画面と項目が URL のハッシュに残り、同じ URL を開き直すと同じ画面と項目が開く。プレビューはワークスペースの記録を書き換えない。
minimal_guarantee: 描画のライブラリが読めないときも画面は開き、読めなかったライブラリの名前が出る。ワークスペースの記録は書き換えない。
frequency: 話し合いの再開のたびと、記録を書き足した後
priority: 高
