summary: 単一ユースケースのシナリオ
items:
  - page: プラグインのインストール.yaml
    summary: マーケットプレイスを登録してプラグイン mindmap をインストールする
  - page: ワークスペースの作成.yaml
    summary: 依存を確かめ、新しいワークスペースを作る
  - page: 記録の追加と更新.yaml
    summary: 検討事項・タスクなどの項目を足す・直す
  - page: 採用する案の切り替え.yaml
    summary: 検討事項の採用する案を切り替え、影響を受ける項目を洗い出す
  - page: 状況の確認.yaml
    summary: 再開時の状況と、次に検討する項目の候補を読む
  - page: 記録の検索.yaml
    summary: 項目を探し、1 件の中身と参照元・使っている属性名を読む
  - page: ワークスペースの点検.yaml
    summary: 参照切れと、YAML と本文の Markdown のずれを洗い出す
  - page: プレビューの書き出し.yaml
    summary: ワークスペースの記録をプレビューの HTML に書き出す
  - page: 話し合いのセットアップ.yaml
    summary: 依存を確かめ、新しいワークスペースを作るか既存の続きを選ぶ
  - page: 発言の取り込み.yaml
    summary: 発言を記録し、派生の検討事項・未整理・タスクを積む
  - page: ヒアリング.yaml
    summary: 前提が揃った未決定を 1 ラウンドにまとめて聞き、答えを記録する
  - page: リサーチ.yaml
    summary: 確認を取ってサブエージェントで調べ、調査を検討事項に繋ぐ
  - page: 方針転換.yaml
    summary: 採用する案を切り替え、影響を要見直しにして見直しのタスクを積む
  - page: プレビューを開く.yaml
    summary: 記録をプレビューの HTML に書き出し、開く場所を示す
  - page: ゴール判定.yaml
    summary: ゴールに届いたかを確かめ、確定した記録を引き渡しの資料に書き出す
