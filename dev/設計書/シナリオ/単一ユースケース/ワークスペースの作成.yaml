title: "ワークスペースの作成"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実際の Python でスクリプトを起動する）
      - name: Python の環境
        description: Python 3・PyYAML・jsonschema が入っている仮想環境
        notes: テストごとの一時フォルダに `python -m venv` で作り、`check-env` の `--venv` で渡す
      - name: ワークスペースの場所
        description: テストごとの一時フォルダの下の、まだ無いフォルダ
      - name: 設定
        description: 分野・最上位の軸の呼び名・フェーズの並び・対象・カテゴリー・ゴール
        notes: 分野 `システム開発`、最上位の軸の呼び名 `システム`、フェーズ `目的` → `要件` → `構成`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SCR as スクリプト
        participant WS as ワークスペース

        CC->>SCR: 依存を確かめる
        SCR-->>CC: 揃っている
        CC->>SCR: フォルダと設定を渡してワークスペースを作る
        SCR->>SCR: 設定をスキーマと突き合わせる
        SCR->>WS: 設定・空の YAML・docs/・handoff/ を書く
        SCR-->>CC: 作ったワークスペースのパス
      ```
    expected:
      - 依存の確認が終了コード 0 で終わる
      - ワークスペースに `mindmap.yaml` があり、渡した分野・最上位の軸の呼び名・フェーズ・対象・カテゴリー・ゴールを持つ
      - ワークスペースに `decisions.yaml`・`tasks.yaml`・`research.yaml`・`docs.yaml`・`terms.yaml`・`notes.yaml`・`logs.yaml` があり、どれも項目を持たない
      - ワークスペースに `docs/` と `handoff/` のフォルダがある
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal
  - name: 異常シナリオ（依存が足りない）
    setup:
      - name: Mock
        description: なし（実際の Python でスクリプトを起動する）
      - name: Python の環境
        description: PyYAML・jsonschema を入れていない Python の仮想環境
        notes: テストごとの一時フォルダに `python -m venv` で作り、`check-env` の `--venv` で渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SCR as スクリプト

        CC->>SCR: 依存を確かめる
        SCR-->>CC: 足りないライブラリと、入れるコマンド
      ```
    expected:
      - 依存の確認が 0 以外の終了コードで終わる
      - 出力に、足りないライブラリ `PyYAML` と `jsonschema` の名前がある
      - 出力に、足りないライブラリを入れるコマンドがある
    test: test_error_when_dependency_missing
  - name: 異常シナリオ（既にワークスペースがある）
    setup:
      - name: Mock
        description: なし（実際の Python でスクリプトを起動する）
      - name: 既存のワークスペース
        description: 作成を 1 回済ませ、検討事項を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SCR as スクリプト
        participant WS as ワークスペース

        CC->>SCR: 既存のワークスペースのフォルダを渡して作る
        SCR->>WS: mindmap.yaml があることを確かめる
        SCR-->>CC: 既にワークスペースがあるエラー
      ```
    expected:
      - 作成が 0 以外の終了コードで終わる
      - 標準エラーに、既にワークスペースがある旨とフォルダのパスがある
      - ワークスペースの全てのファイルの中身が、作成を呼ぶ前と同じである
    test: test_error_when_workspace_exists
lead: スキルが、スクリプトの依存が揃っているかを確かめ、1 つの話し合いのフォルダ（ワークスペース）を新しく作る単一ユースケース。
issue: 3
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 話し合いの記録を始められる。既にある話し合いの記録を上書きされない
trigger: 利用者が新しい話し合いを始め、スキルがセットアップのステップで分野・最上位の軸の呼び名・フェーズ・対象・カテゴリー・ゴールを決め終える
preconditions:
  - プラグイン mindmap がインストールされている
success_guarantee: 指定したフォルダに、決めた設定を持つ `mindmap.yaml` と、空の種類ごとの YAML・`docs/`・`handoff/` があり、全ての YAML がスキーマに合う。
minimal_guarantee: 依存が足りないとき・既にワークスペースがあるときは、フォルダの中身を書き換えない。
notes:
  対応テストファイル: '`tests/e2e/単一ユースケース/test_workspace_create.py`（E2E テスト作成でファイルを作った commit で `test_file` に移す）'
