title: "ワークスペースの点検"
scenarios:
  - name: 正常シナリオ（問題が無い）
    setup:
      - name: Mock
        description: なし（実際の Python でスクリプトを起動する）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 整った記録
        description: D-2 が D-1 に依存し、D-1 の本文が `docs/` にある検討事項
        notes: '`depends_on: [D-1]`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SCR as スクリプト
        participant WS as ワークスペース

        CC->>SCR: ワークスペースを点検する
        SCR->>WS: 全ての YAML と docs/ を読む
        SCR-->>CC: 問題が無い
      ```
    expected:
      - 点検が終了コード 0 で終わる
      - 出力に、問題が無い旨がある
    test: test_normal_when_clean
  - name: 正常シナリオ（参照切れとずれがある）
    setup:
      - name: Mock
        description: なし（実際の Python でスクリプトを起動する）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 参照切れ
        description: 存在しない D-9 に依存する検討事項 D-1
        notes: '`depends_on: [D-9]`'
      - name: 本文の無い項目
        description: 本文を指しているのに、`docs/` にその Markdown が無い調査 R-1
      - name: 項目の無い本文
        description: どの項目からも指されていない `docs/` の Markdown
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SCR as スクリプト
        participant WS as ワークスペース

        CC->>SCR: ワークスペースを点検する
        SCR->>WS: 全ての YAML と docs/ を読む
        SCR-->>CC: 参照切れとずれの一覧
      ```
    expected:
      - 点検が 0 以外の終了コードで終わる
      - 出力に、D-1 の `depends_on` が存在しない D-9 を指す旨がある
      - 出力に、R-1 の本文が `docs/` に無い旨がある
      - 出力に、どの項目からも指されていない `docs/` の Markdown のファイル名がある
      - ワークスペースの全てのファイルの中身が、点検を呼ぶ前と同じである
    test: test_normal_when_problems_found
lead: スキルが、ワークスペースの参照切れと、YAML と本文の Markdown のずれを洗い出す単一ユースケース。
issue: 3
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 消した項目を指したままの記録や、どの項目にも結び付かない本文が残らない
trigger: スキルが記録を書き終えた、または利用者がワークスペースを手で直した
preconditions:
  - ワークスペースが作成済みである
success_guarantee: 参照切れとずれが全て、どの項目のどのキーかとともに出る。どのファイルも書き換えない。
notes:
  対応テストファイル: '`tests/e2e/単一ユースケース/test_workspace_check.py`（E2E テスト作成でファイルを作った commit で `test_file` に移す）'
