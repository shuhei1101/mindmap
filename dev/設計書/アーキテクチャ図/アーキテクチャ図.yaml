repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/mindmap
  layout: '`.claude-plugin/`（マーケットプレイスとプラグインのマニフェスト）/ `skills/setup/`・`skills/session/`（スキル。SKILL.md と `steps/`）/ `skills/mindmap/`（スキルが共通で読む `references/`・`playbooks/`・`README.md` と、スクリプトの `schemas/`・`scripts/`・プレビューの `preview/`。SKILL.md は持たない）'
  notes: リポジトリの直下がマーケットプレイスとプラグインの両方の直下を兼ねる（マーケットプレイスはプラグインを `./` で指す）。
subsystems:
  - name: プラグイン
    scope: plugin
    role: マーケットプレイスとプラグインのマニフェスト。Claude Code にスキルを読み込ませる入口
    runtime: JSON（Claude Code が読む）
    runs_on: 利用者の端末の Claude Code
  - name: スキル
    scope: skill
    role: 会話の進め方の手順（セットアップ `setup` と話し合いの進行 `session` の 2 つ）。ワークスペースへの記録はスクリプトのコマンドで行い、リサーチはサブエージェントに任せる
    runtime: Markdown（Claude Code が読む手順）
    runs_on: 利用者の端末の Claude Code
    status: implemented
  - name: スクリプト
    scope: scripts
    role: ワークスペースの YAML の読み書き・検索・影響の洗い出し・点検と、プレビューの HTML の書き出し
    runtime: Python 3
    runs_on: 利用者の端末（Claude Code から起動するコマンド）
    status: implemented
  - name: プレビュー
    scope: preview
    role: 書き出した 1 枚の HTML で、ワークスペースの記録を読み返す画面
    runtime: TypeScript 7（tsc が生成した JavaScript をブラウザで動かす）
    runs_on: 利用者の端末のブラウザ（ファイルとして開く。サーバーは立てない）
    status: implemented
external_systems:
  - name: Claude Code
    purpose: プラグインの読み込み・スキルの手順の実行・スクリプトのコマンドの起動
    direction: 双方向
    protocol: プラグインのマニフェスト（JSON）/ スキル（Markdown）/ コマンドの標準入出力
    notes:
      事前確認: 不要。Claude Code がプラグインを読み込み、スクリプトを起動する側のため、呼ばれた時点で到達している。
    detail: dev/設計書/外部ライブラリ/claude-code#
  - name: jsDelivr
    purpose: プレビューの描画のライブラリ（marked・DOMPurify・elkjs・mermaid）の取得
    direction: 受信のみ
    protocol: HTTPS
    notes:
      事前確認: 要。プレビューを開いた時点で、描画のライブラリが読み込めたかを確かめる。読み込めなかったときは、読み込めなかったライブラリの名前を画面に出す。
    refs:
      - dev/設計書/外部ライブラリ/marked#
      - dev/設計書/外部ライブラリ/DOMPurify#
      - dev/設計書/外部ライブラリ/elkjs#
      - dev/設計書/外部ライブラリ/mermaid#
  - name: Google Fonts
    purpose: プレビューの文字（Inter・Noto Sans JP・JetBrains Mono）の取得
    direction: 受信のみ
    protocol: HTTPS
    detail: dev/設計書/外部API/GoogleFonts#
    notes:
      事前確認: 不要。読めないときは端末の文字で描き、画面の操作は変わらない。
lead: mindmap のサブシステムと、Claude Code・ブラウザ・CDN との境界。
constraints: |-
  - hooks・MCP サーバーを持たない
  - 他のスキル・外部の仕組みに依存しない
  - スキル・スクリプト・プレビューの中で、特定の開発基盤の名前を出さない
  - 常駐するサーバーを持たない（プレビューはファイルとして開く）
  - ネットがある前提で、描画のライブラリは CDN から、文字は Google Fonts から読む（埋め込む選択肢は持たない）
