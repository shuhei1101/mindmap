title: "プレビューの配信"
entry:
  kind: endpoint
  value: GET /
flows:
  - name: 正常系
    summary: 雛形に CSS と JavaScript を差し込んだ画面を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /

        クライアント->>IF: GET /（Host: 127.0.0.1:{ポート}）
        IF-->>クライアント: 200、HTML
      ```
    expected:
      - ステータスが 200 で、`Content-Type` が `text/html; charset=utf-8`、`Cache-Control` が `no-store`
      - 本文に `<style>` と `<script>` があり、`mindmap-data` の要素が空
    test: test_normal
  - name: 異常系（接続先が違う・403）
    summary: Host が端末の中の名前でなければ画面を返さない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`Host: attacker.example:{ポート}` を付けてつなぐ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /

        クライアント->>IF: GET /（Host: attacker.example）
        IF-->>クライアント: 403
      ```
    expected:
      - ステータスが 403
      - 本文に HTML が無い
    test: test_error_when_host_mismatch
  - name: 異常系（無いパス・404）
    summary: 決めたパス以外は 404 を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`/mindmap.yaml` を GET する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 配信

        クライアント->>IF: GET /mindmap.yaml
        IF-->>クライアント: 404
      ```
    expected:
      - ステータスが 404
      - 本文に `mindmap.yaml` の中身が無い
    test: test_error_when_path_unknown
lead: '`preview_url` が立てた配信が、プレビューの画面（雛形に CSS と JavaScript を差し込んだ HTML）を返す。記録は画面が『記録の取得』で読む。'
idempotent: true
side_effects: なし（読むだけ）
callers:
  - dev/設計書/インターフェース定義/プレビュー/プレビューを開く#
request:
  - name: Host
    type: str
    required: true
    location: header
    description: ブラウザが付ける接続先
    constraints: '`127.0.0.1:{ポート}` か `localhost:{ポート}`'
response:
  - name: 本文
    type: text/html
    description: '`plugins/mindstella/skills/mindmap/preview/` の `template.html` に、画面の CSS を `<style>`、JavaScript を `<script>` の中身として差し込んだ HTML。`<script type="application/json" id="mindmap-data"></script>` は空のまま返す'
  - name: Cache-Control
    type: str
    description: '`no-store`（プラグインを上げた後に古い画面を読ませない）'
status_codes:
  - code: '200'
    condition: 画面を返せた
  - code: '403'
    condition: '`Host` が `127.0.0.1:{ポート}`・`localhost:{ポート}` のどちらでもない'
    notes: 本文は返さない
  - code: '404'
    condition: '`/`・`/api/records`・`/api/events`・`/api/submissions` 以外のパス'
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 待ち受け
    constraint: '`127.0.0.1` だけ（『プレビューの URL』）'
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[待ち受けの範囲]
  - item: 接続先の確かめ
    constraint: 全てのパスで `Host` を確かめ、合わなければ 403 を返す（別のサイトがこの端末の名前を名乗って配信を読む DNS の付け替えを防ぐ）
  - item: 差し込みの安全
    constraint: 差し込む CSS・JavaScript が `</style>`・`</script>` を含むときは、同梱の雛形の誤りとして 500 を返す
  - item: 読み込むファイル
    constraint: 返す HTML は、描画のライブラリを jsDelivr から、文字を Google Fonts から読む（雛形が持つ）。ローカルのファイルは指さない
  - item: 通信
    constraint: 配信は外へ通信しない
refs:
  - dev/設計書/インターフェース定義/サーバー/プレビューのURL#
  - dev/設計書/インターフェース定義/プレビュー/プレビューを開く#
