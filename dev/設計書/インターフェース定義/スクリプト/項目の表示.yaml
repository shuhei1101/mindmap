title: "項目の表示"
entry:
  kind: operation
  value: '`{仮想環境の Python} {スキルのフォルダ}/scripts/mindmap.py show`（コマンドの引数・標準出力・終了コード）。`{仮想環境の Python}` は依存の確認が返す `python_path`'
flows:
  - name: 正常系
    summary: 項目の中身と本文、参照元をキーごとに返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 次の項目を持つワークスペース
        notes: 'D-1: 本文 `docs/D-1.md` あり／D-2: `depends_on: [D-1]`・`related: [D-1]`／T-1: `for: [D-1]`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py show
        participant WS as ワークスペース

        クライアント->>IF: show D-1 --workspace
        IF-->>WS: 全ての YAML と docs/D-1.md を読む
        IF-->>クライアント: JSON（item・body_markdown・referenced_by）
      ```
    expected:
      - 終了コードが 0
      - '`item` が D-1 の全てのキーを持ち、`kind` が `decision`'
      - '`body_markdown` が `docs/D-1.md` の中身'
      - '`referenced_by` が D-2（`depends_on`）・D-2（`related`）・T-1（`for`）の 3 行'
    test: test_normal
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py show
        participant WS as フォルダ

        クライアント->>IF: show D-1 --workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーにフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 異常系（ID が無い・ItemNotFoundError）
    summary: 存在しない ID はエラーで終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 検討事項 D-1 だけを持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py show
        participant WS as ワークスペース

        クライアント->>IF: show D-9 --workspace
        IF-->>WS: D-9 が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーに `D-9` がある
    test: test_error_when_id_not_found
lead: ID で指した 1 項目の全てのキーと本文、その項目を参照している項目を返す。
idempotent: true
side_effects: なし（読むだけ）
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
  - name: id
    type: str
    required: true
    location: argument
    description: 表示する項目の ID（位置引数）
    example: D-1
response:
  - name: item
    type: dict
    description: 項目の全てのキー（YAML にあるとおり）
  - name: kind
    type: str
    description: 種類（`decision` など）
  - name: body_markdown
    type: str | None
    description: '`docs/` の本文。`body` を持たないか、指す Markdown が無いときは `null`'
  - name: referenced_by[].id
    type: str
    description: この項目を参照している項目の ID（種類の順、連番の小さい順）
  - name: referenced_by[].key
    type: '"depends_on" | "parent" | "for" | "related" | "sources"'
    description: 参照しているキー。同じ項目が複数のキーで参照していればキーごとに行を分ける
exceptions:
  - name: なし（正常終了）
    condition: 表示できた
    notes: 終了コード 0
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1
  - name: ItemNotFoundError
    condition: 渡した ID の項目が無い
    notes: 終了コード 1。標準エラーに渡した ID
error_format: '標準エラーに `エラー: {内容}` の行を出す。'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 参照元にするキー
    constraint: '`depends_on`・`parent`・`for`・`related`・`sources`（設定の `goal.deliverables[].doc` は含めない）'
test_file: tests/integration/scripts/test_show.py
