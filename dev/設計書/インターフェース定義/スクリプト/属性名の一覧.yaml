title: "属性名の一覧"
entry:
  kind: operation
  value: '`{仮想環境の Python} {スキルのフォルダ}/scripts/mindmap.py attrs`（コマンドの引数・標準出力・終了コード）。`{仮想環境の Python}` は依存の確認が返す `python_path`'
flows:
  - name: 正常系
    summary: 種類をまたいで属性名と件数を数える
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 次の項目を持つワークスペース
        notes: 'D-1・D-2: 属性 `担当`／T-1: 属性 `期限`・`担当`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py attrs
        participant WS as ワークスペース

        クライアント->>IF: attrs --workspace
        IF-->>WS: 全ての YAML を読む
        IF-->>クライアント: JSON（attrs）
      ```
    expected:
      - 終了コードが 0
      - '`attrs` が `担当`（`count: 3`・`kinds: [decision, task]`）と `期限`（`count: 1`・`kinds: [task]`）の 2 件'
    test: test_normal
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py attrs
        participant WS as フォルダ

        クライアント->>IF: attrs --workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーにフォルダのパスがある
    test: test_error_when_workspace_not_found
lead: ワークスペースの項目が `attrs` で使っている属性名と、使っている件数を返す。
idempotent: true
side_effects: なし（読むだけ）
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
response:
  - name: attrs[].name
    type: str
    description: 属性名（名前の順）
  - name: attrs[].count
    type: int
    description: その属性を持つ項目の数
  - name: attrs[].kinds
    type: list[str]
    description: その属性を持つ項目の種類（`decision` など。重なりなし）
exceptions:
  - name: なし（正常終了）
    condition: 一覧を作れた（属性が 0 件のときも含む）
    notes: 終了コード 0
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1
error_format: '標準エラーに `エラー: {内容}` の行を出す。'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 名前の同一視
    constraint: しない（字面が違えば別の属性名として並べ、揺れの判断はスキルが行う）
test_file: tests/integration/scripts/test_attrs.py
