title: "項目の更新"
entry:
  kind: operation
  value: '`python3 {スキルのフォルダ}/scripts/mindmap.py update`（コマンドの引数・標準入力・標準出力・終了コード）。起動の仕方は『コマンドの起動』'
flows:
  - name: 正常系
    summary: 検討事項の答えと状態を直し、不要になったキーを消す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '検討事項 D-1（状態 `未決定`、`lead` あり、`weight: 大`）を持つワークスペース'
      - name: 標準入力
        description: '`answer`・`status` を変え、`weight` を消す'
        notes: '`{"answer": "種類ごとに分ける", "status": "決定済み", "weight": null}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py update
        participant WS as ワークスペース

        クライアント->>IF: update D-1 --workspace（標準入力に変えるキー）
        IF-->>WS: 全ての YAML を読む
        IF->>IF: キーを置き換え、updated を変えてスキーマと突き合わせる
        IF->>WS: decisions.yaml を書く
        IF-->>クライアント: JSON（id・file・changed）
      ```
    expected:
      - 終了コードが 0
      - D-1 の `answer` と `status` が渡した値で、`weight` のキーが無い
      - D-1 の `lead` と `created` が呼ぶ前と同じで、`updated` が `created` より後
      - '`changed` が `answer`・`status`・`weight`'
    test: test_normal
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すと、何も書かずに終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py update
        participant WS as フォルダ

        クライアント->>IF: update D-1 --workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーにフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 異常系（ID が無い・ItemNotFoundError）
    summary: 存在しない ID は直さず、渡した ID を返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 検討事項 D-1 だけを持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py update
        participant WS as ワークスペース

        クライアント->>IF: update D-9 --workspace
        IF-->>WS: D-9 が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーに `D-9` がある
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_id_not_found
  - name: 異常系（スキーマに合わない・SchemaMismatchError）
    summary: スクリプトが付けるキー `created` を渡すと直さない
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
      - name: 標準入力
        description: '`created` を含む'
        notes: '`{"created": "2000-01-01T00:00:00+00:00"}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py update

        クライアント->>IF: update D-1 --workspace（created を含む）
        IF->>IF: スクリプトが付けるキーを渡された
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーに `created` がある
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_schema_mismatch
  - name: 異常系（書き込めない・WriteFailedError）
    summary: 書き込めないワークスペースでは何も書き換えず、エラーの行を返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 検討事項 D-1 を持ち、ワークスペースのフォルダの書き込みの権限を外したワークスペース
        notes: root で動かすときは skip する
      - name: 標準入力
        description: '`{"answer": "a"}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py update
        participant WS as ワークスペース

        クライアント->>IF: update D-1 --workspace
        IF-->>WS: 全ての YAML を読む
        IF->>WS: 一時ファイルを書けない
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '標準エラーが `エラー: ` で始まり、トレースバックを含まない'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_write_fails
  - name: 異常系（前の形式の資料がある・SchemaMismatchError）
    summary: 資料の done が残るワークスペースでは何も書かず、migrate を案内して終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '検討事項 D-1 と、`done: true` を持つ資料 A-1 を持つワークスペース'
        notes: A-1 は YAML を直接書いて作る
      - name: 標準入力
        description: D-1 の `answer` を変える
        notes: '`{"answer": "種類ごとに分ける"}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py update
        participant WS as ワークスペース

        クライアント->>IF: update --workspace D-1（標準入力）
        IF-->>WS: 全ての YAML を読む
        IF->>IF: スキーマと突き合わせて、資料の done が合わない
        IF-->>クライアント: エラーと migrate の案内、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '標準エラーに `docs.yaml: items[0]` で始まる行があり、最後の行が `ヒント: 資料の done は migrate で status に移せます`'
      - '`decisions.yaml`・`docs.yaml` の中身が呼ぶ前と同じ'
lead: ID で指した 1 項目のキーを、標準入力で渡した値に置き換えて更新日時を変える。
idempotent: false
side_effects: その項目の種類の YAML を書き換える。`body_markdown` を渡したときは `docs/{ID}.md` を書き換え、`body` を `{ID}.md` にする。本文と YAML の一時ファイルを両方書き終えてから、本文 → YAML の順に `os.replace` で置き換える
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
  - name: id
    type: str
    required: true
    location: argument
    description: 直す項目の ID（位置引数）。頭の文字で書き換える YAML が決まる
    example: D-2
  - name: 標準入力
    type: JSON のオブジェクト
    required: false
    location: body
    description: 置き換えるキーと値。渡したキーだけを値ごと置き換え（配列・オブジェクトも丸ごと）、値が `null` のキーは消す。渡さないキーはそのまま
    constraints: '`id`・`created`・`updated`・`body` は持たない'
  - name: 標準入力.body_markdown
    type: str
    required: false
    default: なし（本文を変えない）
    location: body
    description: 本文の Markdown。`docs/{ID}.md` をこの内容で置き換える
    constraints: 調査・資料・検討事項・会話ログだけが持てる（ほかの種類に渡すと SchemaMismatchError）
  - name: --json
    type: str
    required: false
    default: なし（標準入力を読む）
    location: argument
    description: 標準入力と同じ置き換えるキーの JSON を 1 つの引数で渡す。渡したときは標準入力を読まない
    constraints: 標準入力と同じ
response:
  - name: id
    type: str
    description: 直した項目の ID
  - name: file
    type: str
    description: 書き換えた YAML（ワークスペースからの相対パス）
  - name: changed
    type: list[str]
    description: 値が変わった・消えたキーの名前（`updated` は含めない）
exceptions:
  - name: なし（正常終了）
    condition: 直せた
    notes: 終了コード 0
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1。何も書き込まない
  - name: ItemNotFoundError
    condition: 渡した ID の項目が無い（頭の文字がどの種類にも当たらないときも含む）
    notes: 終了コード 1。標準エラーに渡した ID。何も書き込まない
  - name: SchemaMismatchError
    condition: 直した後のワークスペースのどれかの YAML がスキーマに合わない（標準入力が JSON として読めないとき・スクリプトが付けるキーを渡したときも含む）
    notes: 終了コード 1。標準エラーに合わない箇所。何も書き込まない
  - name: WriteFailedError
    condition: 一時ファイルの書き込みか置き換えに失敗した（権限が無い・ほかのプロセスが開いている など）
    notes: 終了コード 1。標準エラーに書けなかったパスと理由。本文は前の中身に戻し、どのファイルも書き換えない
error_format: '標準エラーに `エラー: {内容}` の行を出す。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。合わない箇所に資料の `done` があるときは、最後に `ヒント: 資料の done は migrate で status に移せます` の 1 行を続ける。'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 検証の範囲
    constraint: 直した後のワークスペースの全ての YAML をスキーマと突き合わせる。参照先の ID があるかは確かめない（点検が持つ）
  - item: 会話ログ
    constraint: 制限なし（「後から書き換えない」はスキルの手順が守る）
  - item: YAML の書き方
    constraint: '`safe_dump(allow_unicode=True, sort_keys=False)`。コメントは残らない'
  - item: 部分成功
    constraint: 起こさない。本文を置き換える前に前の本文を控え、YAML の置き換えに失敗したら本文を控えに戻して（前に本文が無ければ消して）からエラーで終わる（終了コード 1。残った一時ファイルも消す）
exclusivity: 同じワークスペースへ同時に呼ばない前提（スキルが 1 つずつ呼ぶ）。ロックは持たない
test_file: tests/integration/scripts/test_update.py
