title: "プレビューの書き出し"
entry:
  kind: operation
  value: '`python3 {スキルのフォルダ}/scripts/mindmap.py build`（コマンドの引数・標準出力・終了コード・書き出す HTML）'
flows:
  - name: 正常系
    summary: 全ての種類と本文を埋め込んだ preview.html を書き出す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 7 つの種類を 1 件ずつ持ち、資料 A-1 の本文に `</script>` を含むワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py build
        participant WS as ワークスペース

        クライアント->>IF: build --workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF->>IF: スキーマと突き合わせ、JSON にまとめて雛形に埋め込む
        IF->>WS: preview.html を書く
        IF-->>クライアント: JSON（path）
      ```
    expected:
      - 終了コードが 0
      - '`path` がワークスペースの `preview.html`'
      - '`preview.html` の `mindmap-data` の中身を JSON として読むと、`settings` と 7 つの種類の項目が YAML と同じで、`bodies` に `A-1.md` の本文がある'
      - '`preview.html` の中に `</script>` が雛形のぶんだけある（本文の `</script>` で要素が閉じていない）'
      - '`preview.html` が読み込む `src`・`href` にローカルのパスが無い'
    test: test_normal
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すと何も書かずに終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py build
        participant WS as フォルダ

        クライアント->>IF: build --workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーにフォルダのパスがある
      - フォルダに `preview.html` が無い
    test: test_error_when_workspace_not_found
  - name: 異常系（YAML がスキーマに合わない・SchemaMismatchError）
    summary: 手で崩した YAML があると、前に書き出した preview.html を残して終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 一度書き出した後、`decisions.yaml` の D-1 の `status` を `完了` に直接書き換えたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py build
        participant WS as ワークスペース

        クライアント->>IF: build --workspace
        IF-->>WS: 全ての YAML を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '標準エラーに `decisions.yaml: items[0].status:` で始まる行がある'
      - '`preview.html` の中身が呼ぶ前と同じ'
    test: test_error_when_schema_mismatch
  - name: 異常系（書き込めない・WriteFailedError）
    summary: 書き込めないワークスペースでは前の preview.html を残して終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 一度書き出した後、ワークスペースのフォルダの書き込みの権限を外したワークスペース
        notes: root で動かすときは skip する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py build
        participant WS as ワークスペース

        クライアント->>IF: build --workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF->>WS: 一時ファイルを書けない
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '標準エラーが `エラー: ` で始まり、トレースバックを含まない'
      - '`preview.html` の中身が呼ぶ前と同じ'
    test: test_error_when_write_fails
lead: ワークスペースの全ての YAML と本文を 1 つの JSON にまとめ、プレビューの画面の雛形に埋め込んだ 1 ファイル `preview.html` を書き出す。
idempotent: true
side_effects: ワークスペースの `preview.html` を一時ファイルから `os.replace` で置き換える。サーバーは立てず、ブラウザも開かない
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
response:
  - name: path
    type: str
    description: 書き出した `preview.html` の絶対パス
  - name: 埋め込みのデータ.settings
    type: dict
    description: '`mindmap.yaml` の中身'
  - name: 埋め込みのデータ.decisions / tasks / research / docs / terms / notes / logs
    type: list[dict]
    description: 種類ごとの YAML の `items` の中身（キー名はファイル名から `.yaml` を落としたもの）
  - name: 埋め込みのデータ.bodies
    type: dict[str, str]
    description: '`docs/` のファイル名 → 本文の Markdown（項目の `body` が指すものだけ）'
  - name: 埋め込みのデータ.built_at
    type: str
    description: 書き出した日時（UTC のタイムゾーン付き ISO 8601）
response_notes: |-
  > [!NOTE]
  > 埋め込みのデータは、雛形の `<script type="application/json" id="mindmap-data"></script>` の中身として入る。画面はこの要素の中身を `JSON.parse` して読む。
exceptions:
  - name: なし（正常終了）
    condition: 書き出せた
    notes: 終了コード 0
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1。何も書き込まない
  - name: SchemaMismatchError
    condition: ワークスペースのどれかの YAML がスキーマに合わないか、YAML として読めない
    notes: 終了コード 1。標準エラーに合わない箇所。`preview.html` を書き換えない
  - name: WriteFailedError
    condition: '`preview.html` の書き込みか置き換えに失敗した'
    notes: 終了コード 1。標準エラーに書けなかったパスと理由。前の `preview.html` を残す
error_format: '標準エラーに `エラー: {内容}` の行を出す。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 雛形
    constraint: '`skills/mindmap/preview/template.html`。`<script type="application/json" id="mindmap-data"></script>` をちょうど 1 つ持つ。画面の中身は #5 が持ち、この PR はデータの件数を出すだけの雛形を置く'
  - item: 埋め込みの安全
    constraint: 埋め込む JSON の `<`・`>`・`&` を、それぞれ JSON の Unicode エスケープ（バックスラッシュに続けて `u003c`・`u003e`・`u0026`）に置き換える。`JSON.parse` で元の文字に戻り、本文に `</script>` があっても要素を閉じさせない。Python の `json.dumps` はこれらをエスケープしないので、書き出しの側で置き換える
  - item: 読み込むファイル
    constraint: '`preview.html` はワークスペースの他のローカルのファイルを指さない。描画のライブラリは CDN から読む（雛形が持つ）'
  - item: 通信
    constraint: スクリプトは通信しない
notes:
  対応テストファイル: '`tests/integration/scripts/test_build.py`（結合テスト作成でファイルを作った commit で `test_file` に移す）'
