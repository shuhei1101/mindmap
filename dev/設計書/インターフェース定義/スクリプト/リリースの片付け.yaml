title: "リリースの片付け"
entry:
  kind: operation
  value: '`python3 {スキルのフォルダ}/scripts/mindmap.py clear-release`（コマンドの引数・標準出力・終了コード）。起動の仕方は『コマンドの起動』'
flows:
  - name: 正常系
    summary: release/ の中身を消し、消したものを返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '`release/` に `古い資料.md` と、ファイルを 1 つ持つフォルダ `図/` があるワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py clear-release
        participant WS as ワークスペース

        クライアント->>IF: clear-release --workspace
        IF-->>WS: mindmap.yaml があるか確かめる
        IF->>WS: release/ の中のファイルとフォルダを消す
        IF-->>クライアント: JSON（removed）
      ```
    expected:
      - 終了コードが 0
      - '`removed` が `古い資料.md`・`図/` の順'
      - '`release/` があり、中身が空'
      - '`release/` の外のファイルの中身が、呼ぶ前と同じ'
    test: test_normal
  - name: 正常系（release/ が無い）
    summary: release/ を持たないワークスペースでは空の release/ を作る
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '`release/` を消し、前の版の `handoff/` に `資料.md` があるワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py clear-release
        participant WS as ワークスペース

        クライアント->>IF: clear-release --workspace
        IF-->>WS: mindmap.yaml があるか確かめる
        IF->>WS: 空の release/ を作る
        IF-->>クライアント: JSON（removed は空）
      ```
    expected:
      - 終了コードが 0
      - '`removed` が空'
      - 空の `release/` がある
      - '`handoff/` とその中の `資料.md` が、呼ぶ前と同じ'
    test: test_normal_when_release_dir_missing
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すと何も消さずにエラーで終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無く、`release/` に `資料.md` がある）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py clear-release
        participant WS as フォルダ

        クライアント->>IF: clear-release --workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーにフォルダのパスがある
      - '`release/` の `資料.md` が残っている'
    test: test_error_when_workspace_not_found
  - name: 異常系（消せない・WriteFailedError）
    summary: 消せないものに当たった時点でエラーで終わり、それまでに消したものは消えたままになる
    setup:
      - name: Mock
        description: 消す処理を差し替え、`release/` の `二.md` を消すときに `PermissionError` を出す
      - name: make_workspace
        description: '`release/` に `一.md`・`二.md` があるワークスペース'
        notes: 名前の順に消すので、`一.md` を消した後に `二.md` で止まる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py clear-release
        participant WS as ワークスペース

        クライアント->>IF: clear-release --workspace
        IF-->>WS: mindmap.yaml があるか確かめる
        IF->>WS: 一.md を消す
        IF->>WS: 二.md を消せない
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準出力が空
      - '標準エラーが `エラー: ` で始まり、消せなかった `二.md` のパスを含み、トレースバックを含まない'
      - '`release/` に `二.md` が残り、`一.md` は無い'
    test: test_error_when_remove_fails
lead: ゴール判定でリリースの資料を書き出す前に、`release/` の中身を消して空の `release/` を用意する。
idempotent: true
side_effects: '`release/` の中のファイルとフォルダを消す（`release/` が無ければ作る）。`release/` の外は読み書きしない'
callers:
  - dev/設計書/インターフェース定義/スキル/話し合いの進行#
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
response:
  - name: removed[]
    type: list[str]
    description: 消したものの `release/` からのパス。フォルダは末尾に `/` を付け、中のファイルは並べない。名前の順
exceptions:
  - name: なし（正常終了）
    condition: 消すものが無かったときを含む
    notes: 終了コード 0
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1。何も消さない
  - name: WriteFailedError
    condition: '`release/` の中のものを消せない、または `release/` を作れない（権限が無い・他のプログラムが開いている）'
    notes: 終了コード 1。消せなかった時点で止め、それまでに消したものは戻さない。次の `clear-release` で片付く
error_format: '標準エラーに `エラー: {内容}` の行を出す。'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 消す範囲
    constraint: '`{ワークスペースのフォルダ}/release/` の中だけ。`release/` 自体と、前の版の `handoff/` は消さない'
  - item: 起動
    constraint: 起動した Python に依存が無ければ、スキル専用の仮想環境の Python で起動し直す（『コマンドの起動』）
notes:
  スクリプトに置く理由: '`session` は Bash を `mindmap.py` の起動だけに絞っており、Write はファイルを消せない。古いファイルを残さず最新の確定版の一式だけを置くため、消す処理をスクリプトのコマンドにする'
  対応テストファイル: '`tests/integration/scripts/test_clear_release.py` を結合テスト作成で作り、作ったときに `test_file` へ移す'
