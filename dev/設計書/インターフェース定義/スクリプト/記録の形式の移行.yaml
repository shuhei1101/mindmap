title: "記録の形式の移行"
entry:
  kind: operation
  value: '`python3 {スキルのフォルダ}/scripts/mindmap.py migrate`（コマンドの引数・標準出力・終了コード）。起動の仕方は『コマンドの起動』'
flows:
  - name: 正常系（手順を並べる）
    summary: 版を記録する前の形式のワークスペースで、v0.3.0 の手順と値が要るキーを返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '版のファイルを持たず、`summary` を持たない `mindmap.yaml` と、資料 A-1（`done: true`）を持つワークスペース'
        notes: YAML を直接書いて作る。引数は `--plan`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace --plan
        IF-->>WS: 版のファイルを読む（無い）
        IF->>IF: プラグインの版までの手順を並べる
        IF-->>クライアント: JSON（relation・steps・needs_values）
      ```
    expected:
      - 終了コード 0
      - '`workspace_version` が `null`、`plugin_version` が `v0.3.0`、`relation` が `older`'
      - '`steps` が全て `version: v0.3.0` で、`destructive` が全て `false`'
      - '`needs_values` に `mindmap.yaml` の `summary` がある'
      - ワークスペースの全てのファイルの中身と更新日時が呼ぶ前と同じ
  - name: 正常系（手順を当てる）
    summary: 写しを取って v0.3.0 の手順を当て、版のファイルは書かない
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '版のファイルを持たず、`summary` を持たない `mindmap.yaml` と、資料 A-1（`done: true`）・A-2（`done: false`）を持つ、git の作業ツリーではないワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace
        IF->>WS: 隣のフォルダへ複製する
        IF->>WS: v0.3.0 の手順を並びの順に当てる
        IF-->>クライアント: JSON（steps・needs_values・backup）
      ```
    expected:
      - 終了コード 0
      - '`docs.yaml` の A-1 が `status: 完成`、A-2 が `status: 下書き` で、どちらも `done` を持たず、`updated` が呼ぶ前と同じ'
      - '`needs_values` に `mindmap.yaml` の `summary` がある'
      - '`backup.kind` が `copy` で、`backup.ref` のフォルダに呼ぶ前の `docs.yaml` がある'
      - '`mindstella-version.ini` が無いまま'
  - name: 正常系（写しを git のコミットで取る）
    summary: git の作業ツリーの中のワークスペースでは、ワークスペースのパスだけをコミットして写しにする
    setup:
      - name: Mock
        description: なし（実際の Python と git で起動する）
      - name: git の作業ツリー
        description: テストごとの一時フォルダで `git init` し、その下に版を記録する前の形式のワークスペースと、ワークスペースの外のファイル `other.txt` を置く
        notes: どちらもコミットしない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant G as git

        クライアント->>IF: migrate --workspace
        IF->>G: ワークスペースのパスだけを add してコミットする
        IF->>IF: 手順を当てる
        IF-->>クライアント: JSON（backup.kind: git）
      ```
    expected:
      - 終了コード 0
      - '`backup.kind` が `git`、`backup.ref` が新しいコミットの ID'
      - そのコミットがワークスペースのパスのファイルだけを持ち、`other.txt` を持たない
  - name: 正常系（値を入れる）
    summary: --set で値が要るキーに値を入れる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 手順を当てた後の、`summary` を持たない `mindmap.yaml` のワークスペース
        notes: 引数は `--set mindmap.yaml:summary=要件出しのスキルを設計する`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace --set
        IF->>WS: mindmap.yaml の summary を書く
        IF-->>クライアント: JSON
      ```
    expected:
      - 終了コード 0
      - '`mindmap.yaml` の `summary` が渡した題名'
      - '`mindstella-version.ini` が無いまま'
  - name: 正常系（版を書く）
    summary: 点検に合うワークスペースで --record が版のファイルを書く
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 手順を当てて題名を入れた後の、版のファイルを持たないワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace --record
        IF-->>WS: 全ての YAML を読み、スキーマと突き合わせる
        IF->>WS: mindstella-version.ini を書く
        IF-->>クライアント: JSON（recorded）
      ```
    expected:
      - 終了コード 0
      - '`recorded` が `v0.3.0`'
      - '`mindstella-version.ini` の 1 行目が `v0.3.0`'
  - name: 正常系（版が同じ）
    summary: 今の版のワークスペースでは並べる手順が無い
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '`init` で作ったワークスペース'
        notes: 引数は `--plan`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace --plan
        IF-->>WS: 版のファイルを読む
        IF-->>クライアント: JSON（relation: same・steps は空）
      ```
    expected:
      - 終了コード 0
      - '`relation` が `same`、`steps` と `needs_values` が空'
  - name: 正常系（版が新しいワークスペースを並べる）
    summary: --plan はエラーにせず newer を返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '`init` で作り、版のファイルを `v99.0.0` に書き換えたワークスペース'
        notes: 引数は `--plan`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace --plan
        IF-->>WS: 版のファイルを読む
        IF-->>クライアント: JSON（relation: newer・steps は空）
      ```
    expected:
      - 終了コード 0
      - '`workspace_version` が `v99.0.0`、`relation` が `newer`、`steps` が空'
  - name: 異常系（版が新しい・WorkspaceNewerError）
    summary: 版が新しいワークスペースには手順を当てない
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '`init` で作り、版のファイルを `v99.0.0` に書き換えたワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace
        IF-->>WS: 版のファイルを読む
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コード 1
      - 標準エラーに `v99.0.0` と `v0.3.0` がある
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じで、写しのフォルダが作られていない
  - name: 異常系（手順が失敗する・StepFailedError）
    summary: 手順が読めないファイルに当たると写しから戻して終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '版のファイルを持たず、`docs.yaml` の中身が `items: [`（YAML として読めない）のワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace
        IF->>WS: 写しを取る
        IF->>IF: v0.3.0 の手順が docs.yaml を読めない
        IF->>WS: 写しから戻す
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コード 1
      - '標準エラーが `エラー: v0.3.0 の手順 ` で始まり、`docs.yaml` がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
      - '`mindstella-version.ini` が無いまま'
  - name: 異常系（点検に合わない・SchemaMismatchError）
    summary: 値が要るキーが無いままでは版を書かない
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 手順を当てた後の、`summary` を持たない `mindmap.yaml` のワークスペース
        notes: 引数は `--record`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate --workspace --record
        IF-->>WS: 全ての YAML を読み、スキーマと突き合わせる
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コード 1
      - '標準エラーに `mindmap.yaml: ` で始まり `summary` を含む行がある'
      - '`mindstella-version.ini` が無いまま'
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すと何も書かずに終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py migrate
        participant WS as フォルダ

        クライアント->>IF: migrate --workspace --plan
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コード 1
      - 標準エラーにフォルダのパスがある
      - フォルダにファイルが増えていない
lead: ワークスペースの版とプラグインの版を比べ、間の版の移し替えの手順（`migrations/{版}/steps.yaml`）を版の順に並べる・当てる。値が要るキーを入れ、点検に合えば版のファイルを書き換える。
idempotent: false
side_effects: '`--plan` は何も書かない。手順を当てるときは、当てる前に写しを取り（ワークスペースが git の作業ツリーの中ならワークスペースのパスだけをコミット、そうでなければフォルダの隣へ複製）、手順が書き換えるファイルを書く。失敗したら写しから戻す。`--set` は指したファイルの 1 キーを、`--record` は `mindstella-version.ini` を書く'
exclusivity: 同じワークスペースへ同時に呼ばない前提（スキルが 1 つずつ呼ぶ）。ロックは持たない
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
  - name: --plan
    type: bool
    required: false
    default: 'false'
    location: argument
    description: 当てずに、版の比べた結果と当てる手順を返す
    constraints: '`--set`・`--record` と一緒に使わない'
  - name: --from
    type: str
    required: false
    default: なし（ワークスペースの `mindstella-version.ini` の版。無ければ版を記録する前の形式）
    location: argument
    description: この版より後の手順を当てる
    constraints: '`v{メジャー}.{マイナー}.{パッチ}`'
  - name: --to
    type: str
    required: false
    default: なし（プラグインの版。`plugins/mindstella/version.ini` の 1 行目）
    location: argument
    description: この版以下の手順を当てる。`--record` では書く版
    constraints: '`v{メジャー}.{マイナー}.{パッチ}`。`--from` より前の版は渡さない'
  - name: --set
    type: list[str]
    required: false
    default: なし（値を入れない）
    location: argument
    description: 値が要るキーに入れる値。`{ファイル}:{キーのパス}={値}` を繰り返して渡す
    example: mindmap.yaml:summary=要件出しのスキルを設計する
    constraints: '`{ファイル}` はワークスペースからの相対パス、`{キーのパス}` は `.` 区切り。手順を当てる・`--record` と一緒に使わない'
  - name: --record
    type: bool
    required: false
    default: 'false'
    location: argument
    description: ワークスペースを点検し、問題が無ければ `mindstella-version.ini` を `--to` の版に書き換える
    constraints: '`--plan`・`--set` と一緒に使わない'
response:
  - name: workspace_version
    type: str | None
    description: ワークスペースの版。版を記録する前の形式は `null`
  - name: plugin_version
    type: str
    description: プラグインの版
  - name: relation
    type: Literal['older', 'same', 'newer']
    description: プラグインの版と比べたワークスペースの版
  - name: steps[]
    type: list[{version, index, op, destructive, summary}]
    description: 当てる（当てた）手順を版の順・並びの順に並べたもの。`--set`・`--record` では空
  - name: steps[].version
    type: str
    description: 手順の版（`migrations/` のフォルダ名）
  - name: steps[].index
    type: int
    description: '`steps.yaml` の中の 1 始まりの番号'
  - name: steps[].op
    type: Literal['rename_file', 'move_dir', 'delete', 'rename_key', 'set_default', 'map_values', 'call']
    description: 操作
  - name: steps[].destructive
    type: bool
    description: 破壊的な操作（`rename_file`・`move_dir`・`delete`）か
  - name: steps[].summary
    type: str
    description: 手順の中身の 1 行
    example: docs.yaml の items[].done を status に名前を変える
  - name: needs_values[]
    type: list[{file, key, description}]
    description: 手順を当てた後に値が要るキー（`set_default` の `ask`）。値を入れるまで点検に合わない。`--plan` でも返す
  - name: backup
    type: '{kind, ref} | None'
    description: 取った写し。手順を当てたときだけ持つ
  - name: backup.kind
    type: Literal['git', 'copy']
    description: git のコミットか、フォルダの複製か
  - name: backup.ref
    type: str
    description: コミットの ID か、複製したフォルダの絶対パス
  - name: recorded
    type: str | None
    description: '`--record` で書いた版'
exceptions:
  - name: なし（正常終了）
    condition: 並べた・当てた・値を入れた・版を書いた、または当てる手順が無かった
    notes: 終了コード 0
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1。何も書き込まない
  - name: WorkspaceNewerError
    condition: 手順を当てる・`--record` で、ワークスペースの版がプラグインの版より新しい
    notes: '終了コード 1。標準エラーに 2 つの版と、プラグインを更新するよう書く。何も書き込まない。`--plan` はエラーにせず `relation: newer` を返す'
  - name: StepFailedError
    condition: 手順を当てる途中で、手順が対象のファイルを読めない・書けない、または `call` の変換が例外を送った
    notes: 終了コード 1。写しから戻してから、標準エラーに失敗した版・手順の番号・操作・理由を書く
  - name: SchemaMismatchError
    condition: '`--record` で、ワークスペースのどれかの YAML がスキーマに合わない'
    notes: 終了コード 1。標準エラーに合わない箇所。版のファイルを書かない
  - name: WriteFailedError
    condition: 写しを取れない、または `--set`・`--record` の書き込みに失敗した
    notes: 終了コード 1。標準エラーに書けなかったパスと理由。写しを取れないときは手順を当てない
  - name: 引数の誤り
    condition: 版の形が違う・`--to` が `--from` より前・一緒に使わない引数を渡した・`--set` の形が違う
    notes: 終了コード 2
error_format: '標準エラーに `エラー: {内容}` の行を出す。手順の失敗は `エラー: {版} の手順 {番号}（{操作}）: {理由}`。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 版の比べ方
    constraint: '`v` を落とした 3 つの整数を左から比べる。版を記録する前の形式（版のファイルが無い）はどの版よりも古い'
  - item: 当てる手順
    constraint: '`plugins/mindstella/skills/mindmap/migrations/` の版のフォルダのうち、`--from` より後で `--to` 以下のものを版の順に、各 `steps.yaml` の並びの順に当てる。`--from` が `--to` 以上なら手順は空'
  - item: steps.yaml の形
    constraint: '`steps:` の並び。1 つの手順は `op` と操作ごとの引数を持ち、`schemas/migration-steps.schema.json` で点検する。合わなければ当てずにエラー（終了コード 1）'
  - item: 操作と引数
    constraint: '`rename_file`（`from`・`to`）/ `move_dir`（`from`・`to`）/ `delete`（`path`）/ `rename_key`（`file`・`each_item`・`from`・`to`）/ `set_default`（`file`・`each_item`・`key`・`value` か `ask`）/ `map_values`（`file`・`each_item`・`key`・`map`）/ `call`（`script`。`scripts/{script}.py` の `migrate(root)` を呼ぶ）。パスはワークスペースからの相対、`each_item: true` は `items[]` の各項目に当てる'
  - item: 値が要るキー
    constraint: '`set_default` が `ask`（利用者に聞くことの説明）を持つときは、キーが無い項目に何も書かず `needs_values` に返す。値は `--set` で入れる'
  - item: 手順を当てるときの検証
    constraint: ワークスペース全体をスキーマと突き合わせない（突き合わせは `check` と `--record` が担う）。手順そのものが失敗したときだけエラーで終わる
  - item: 写し
    constraint: ワークスペースが git の作業ツリーの中なら、ワークスペースのパスだけを `git add -A` してコミットする（変更が無ければ今の HEAD を写しにする）。そうでなければ、ワークスペースの隣の `{フォルダ名}.before-{--to の版}`（あれば末尾に `-{日時}`）へ複製する。写しは成功しても消さない
  - item: 戻し方
    constraint: git の写しは、ワークスペースのパスをコミットの中身に戻し、コミットに無いファイルを消す。複製の写しは、ワークスペースの中身を消して複製から書き戻す
  - item: 版のファイルの書き換え
    constraint: '`--record` だけが書く。手順を当てる・`--set` は書かない'
  - item: YAML の書き方
    constraint: '`safe_dump(allow_unicode=True, sort_keys=False)`。コメントは残らない。手順が触らない項目の `updated` は変えない'
