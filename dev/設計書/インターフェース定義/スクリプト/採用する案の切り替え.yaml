title: "採用する案の切り替え"
entry:
  kind: operation
  value: '`python3 {スキルのフォルダ}/scripts/mindmap.py adopt`（コマンドの引数・標準出力・終了コード）。起動の仕方は『コマンドの起動』'
flows:
  - name: 正常系
    summary: 案 A から案 B へ採用を切り替える
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 案 A（採用）と案 B を持つ検討事項 D-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py adopt
        participant WS as ワークスペース

        クライアント->>IF: adopt D-1 B --workspace
        IF-->>WS: 全ての YAML を読む
        IF->>IF: 案 B だけを採用にしてスキーマと突き合わせる
        IF->>WS: decisions.yaml を書く
        IF-->>クライアント: JSON（adopted: B、previous: A）
      ```
    expected:
      - 終了コードが 0
      - '`adopted` が `B`、`previous` が `A`'
      - D-1 の案 B の `adopted` が真、案 A の `adopted` が偽
      - D-1 の `status`・`answer` が呼ぶ前と同じ
    test: test_normal
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すと、何も書かずに終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py adopt
        participant WS as フォルダ

        クライアント->>IF: adopt D-1 B --workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーにフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 異常系（ID が無い・ItemNotFoundError）
    summary: 存在しない検討事項は切り替えない
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 検討事項 D-1 だけを持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py adopt
        participant WS as ワークスペース

        クライアント->>IF: adopt D-9 A --workspace
        IF-->>WS: D-9 が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーに `D-9` がある
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_id_not_found
  - name: 異常系（案が無い・OptionNotFoundError）
    summary: 検討事項が持たない記号は切り替えず、持っている記号を返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 案 A（採用）と案 B を持つ検討事項 D-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py adopt
        participant WS as ワークスペース

        クライアント->>IF: adopt D-1 Z --workspace
        IF-->>WS: D-1 に案 Z が無い
        IF-->>クライアント: エラー（持っている記号 A・B）、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーに `Z`、`A`、`B` がある
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_option_not_found
  - name: 異常系（スキーマに合わない・SchemaMismatchError）
    summary: 手で崩した YAML が残っていると切り替えず、合わない箇所を返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 案 A（採用）と案 B を持つ D-1 と、`status` を `完了` に直接書き換えた D-2 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py adopt
        participant WS as ワークスペース

        クライアント->>IF: adopt D-1 B --workspace
        IF-->>WS: 全ての YAML を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '標準エラーに `decisions.yaml: items[1].status:` で始まる行がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_schema_mismatch
  - name: 異常系（書き込めない・WriteFailedError）
    summary: 書き込めないワークスペースでは切り替えず、エラーの行を返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 案 A（採用）と案 B を持つ D-1 を持ち、ワークスペースのフォルダの書き込みの権限を外したワークスペース
        notes: root で動かすときは skip する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py adopt
        participant WS as ワークスペース

        クライアント->>IF: adopt D-1 B --workspace
        IF-->>WS: 全ての YAML を読む
        IF->>WS: 一時ファイルを書けない
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '標準エラーが `エラー: ` で始まり、トレースバックを含まない'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_write_fails
lead: 検討事項の案のうち、指定した記号の案だけを採用にし、ほかの案の採用を外す。
idempotent: true
side_effects: '`decisions.yaml` のその検討事項の `options[].adopted` と `updated` を書き換える。状態・答えは変えない'
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
  - name: id
    type: str
    required: true
    location: argument
    description: 検討事項の ID（位置引数の 1 つめ）
    constraints: '`D-` で始まる'
    example: D-1
  - name: key
    type: str
    required: true
    location: argument
    description: 採用する案の記号（位置引数の 2 つめ。`options[].key`）
    example: B
response:
  - name: id
    type: str
    description: 検討事項の ID
  - name: adopted
    type: str
    description: 採用した案の記号
  - name: previous
    type: str | None
    description: それまで採用していた案の記号。無ければ `null`
exceptions:
  - name: なし（正常終了）
    condition: 切り替えた（既にその案が採用のときも含む）
    notes: 終了コード 0
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1。何も書き込まない
  - name: ItemNotFoundError
    condition: 渡した ID の検討事項が無い（`D-` 以外の ID も含む）
    notes: 終了コード 1。標準エラーに渡した ID。何も書き込まない
  - name: OptionNotFoundError
    condition: 検討事項が渡した記号の案を持たない
    notes: 終了コード 1。標準エラーに渡した記号と、その検討事項が持つ案の記号の一覧。何も書き込まない
  - name: SchemaMismatchError
    condition: 切り替えた後のワークスペースのどれかの YAML がスキーマに合わない（YAML として読めないときも含む）
    notes: 終了コード 1。標準エラーに合わない箇所。何も書き込まない
  - name: WriteFailedError
    condition: 一時ファイルの書き込みか置き換えに失敗した
    notes: 終了コード 1。標準エラーに書けなかったパスと理由。何も書き換えない
error_format: '標準エラーに `エラー: {内容}` の行を出す。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。合わない箇所に前の版の形式（資料の `done`・`mindmap.yaml` の `summary` が無い）があるときは、最後に `ヒント: 前の版の形式の記録は migrate で今の形式に移せます` の 1 行を続ける。'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 採用の数
    constraint: 切り替えた後、`adopted` が真の案はちょうど 1 つ
  - item: 影響の洗い出し
    constraint: しない（影響は `impact`、要見直しにするかはスキルの手順が決める）
exclusivity: 同じワークスペースへ同時に呼ばない前提（スキルが 1 つずつ呼ぶ）。ロックは持たない
test_file: tests/integration/scripts/test_adopt.py
