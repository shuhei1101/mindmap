title: "配る書き出し"
entry:
  kind: operation
  value: '`python3 {スキルのフォルダ}/scripts/mindmap.py export`（コマンドの引数・標準出力・終了コード・書き出す HTML）。起動の仕方は『コマンドの起動』'
flows:
  - name: 正常系
    summary: 記録・画面・描画のライブラリ・ライセンスの表示を中に持つ 1 枚の HTML を --out へ書き出す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 7 つの種類を 1 件ずつ持ち、資料 A-1 の本文に `</script>` を含み、`build` で `preview.html` を書き出したワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの `配る.html`（まだ無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py export
        participant WS as ワークスペース
        participant OUT as 書き出す先

        クライアント->>IF: export --workspace --out
        IF-->>WS: 全ての YAML と docs/ を読む
        IF->>IF: スキーマと突き合わせ、雛形に画面・描画のライブラリ・ライセンスの表示・データを入れる
        IF->>OUT: HTML を書く
        IF-->>クライアント: JSON（path）
      ```
    expected:
      - 終了コードが 0
      - '`path` が `配る.html` の絶対パス'
      - '`配る.html` の `mindmap-data` の中身を JSON として読むと、`settings` と 7 つの種類の項目が YAML と同じで、`bodies` に `A-1.md` の本文がある'
      - '`配る.html` の `script`・`link`・`img` に `src`・`href` を持つものが無い'
      - '`配る.html` の中に `</script>` が雛形のぶんだけある（本文の `</script>` で要素が閉じていない）'
      - '`mindmap-licenses` の中身に、marked・DOMPurify・elkjs・mermaid のそれぞれの名前・版・著作権の表示・ライセンスの名前があり、elkjs のソースコードの入手先の URL がある'
      - ワークスペースの `preview.html` の中身が、呼ぶ前と同じ
    test: test_normal
  - name: 異常系（--out が preview.html を指す・引数の誤り）
    summary: ワークスペースの preview.html を書き出す先にすると、何も書かずに終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: '`build` で `preview.html` を書き出したワークスペース'
        notes: '`--out` は `{ワークスペース}/preview.html`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py export

        クライアント->>IF: export --workspace --out {ワークスペース}/preview.html
        IF-->>クライアント: エラー、終了コード 2
      ```
    expected:
      - 終了コードが 2
      - 標準エラーに `--out` がある
      - ワークスペースの `preview.html` の中身が、呼ぶ前と同じ
    test: test_error_when_out_is_preview
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すと何も書かずに終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
      - name: 書き出す先
        description: 別の一時フォルダの `配る.html`（まだ無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py export
        participant WS as フォルダ

        クライアント->>IF: export --workspace --out
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーにフォルダのパスがある
      - '`配る.html` が無い'
    test: test_error_when_workspace_not_found
  - name: 異常系（YAML がスキーマに合わない・SchemaMismatchError）
    summary: 手で崩した YAML があると、前に書き出した --out のファイルを残して終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 一度 `export` で書き出した後、`decisions.yaml` の D-1 の `status` を `完了` に直接書き換えたワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの、一度書き出した `配る.html`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py export
        participant WS as ワークスペース

        クライアント->>IF: export --workspace --out
        IF-->>WS: 全ての YAML を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '標準エラーに `decisions.yaml: items[0].status:` で始まる行がある'
      - '`配る.html` の中身が呼ぶ前と同じ'
    test: test_error_when_schema_mismatch
  - name: 異常系（書き出す先のフォルダが無い・WriteFailedError）
    summary: --out の親のフォルダが無いと、フォルダを作らずに終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 書き出す先
        description: 一時フォルダの中の無いフォルダ `無い/` の `配る.html`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py export
        participant OUT as 書き出す先

        クライアント->>IF: export --workspace --out
        IF-->>OUT: 親のフォルダが無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '標準エラーが `エラー: ` で始まり、`配る.html` のパスを含み、トレースバックを含まない'
      - フォルダ `無い/` が無い
    test: test_error_when_out_dir_missing
lead: ワークスペースの記録を、画面と描画のライブラリまで中に持つ見るだけの 1 枚の HTML にして、指定したパスへ書き出す。ワークスペースもサーバーもネットも持たない人へ配るために使う。
test_file: tests/integration/scripts/test_export.py
idempotent: true
side_effects: '`--out` のファイルを、同じフォルダの一時ファイルから `os.replace` で置き換える。ワークスペースは読むだけで、`preview.html` も書き換えない。サーバーは立てず、ブラウザも開かず、通信もしない'
callers:
  - dev/設計書/インターフェース定義/スキル/話し合いの進行#
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
  - name: --out
    type: str
    required: true
    location: argument
    description: 書き出す HTML のファイルのパス。相対パスは起動した場所から読む。既にあるファイルは置き換える
    constraints: 末尾が `.html`。ワークスペースの `preview.html` を指さない。親のフォルダがある
    example: ~/渡す/新規事業の検討.html
response:
  - name: path
    type: str
    description: 書き出した HTML の絶対パス
  - name: 埋め込みのデータ
    type: dict
    description: 『プレビューの書き出し』の埋め込みのデータと同じ形で、`<script type="application/json" id="mindmap-data">` の中身に入る
  - name: ライセンスの表示
    type: str
    description: '`<script type="text/plain" id="mindmap-licenses">` の中身。中に持つライブラリごとに、名前・版・著作権の表示・ライセンスの名前と本文を並べる。elkjs は EPL-2.0 を選んだ旨と、ソースコードの入手先（リポジトリと版のタグの URL）を持つ。DOMPurify は Apache-2.0 を選ぶ。mermaid は、配布ファイルが中に束ねた依存ごとの名前・版とライセンスの本文も続ける。画面には出さない'
exceptions:
  - name: なし（正常終了）
    condition: 書き出せた
    notes: 終了コード 0
  - name: 引数の誤り
    condition: '`--out` の末尾が `.html` でない、またはワークスペースの `preview.html` を指す'
    notes: 終了コード 2。何も書き込まない
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1。何も書き込まない
  - name: SchemaMismatchError
    condition: ワークスペースのどれかの YAML がスキーマに合わないか、YAML として読めない
    notes: 終了コード 1。標準エラーに合わない箇所。`--out` のファイルを書き換えない
  - name: WriteFailedError
    condition: '`--out` の親のフォルダが無い、または書き込みか置き換えに失敗した'
    notes: 終了コード 1。標準エラーに書けなかったパスと理由。親のフォルダは作らず、前の `--out` のファイルを残す
error_format: '『プレビューの書き出し』と同じ。標準エラーに `エラー: {内容}` の行を出し、スキーマに合わないときは合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。引数の誤りは argparse の形で引数の名前を出す'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 雛形
    constraint: '`build` と同じ `template.html` と画面の CSS・JavaScript を使う。雛形の描画のライブラリの `<script src>` と文字の `<link>` を外し、同梱したライブラリの配布ファイルの中身を画面の JavaScript より前の `<script>` の中身として差し込む'
  - item: 埋め込みの安全
    constraint: 『プレビューの書き出し』と同じ。差し込むライブラリ・ライセンスの本文が `</script`・`<script` を含むときは、同梱の誤りとして書き出さずにエラーにする（大文字・小文字を区別しない）
  - item: 読み込むファイル
    constraint: 書き出した HTML は外のファイルも URL も指さない（`script`・`link`・`img` に `src`・`href` を持たない）。文字は端末の文字で描く
  - item: 見るだけ
    constraint: 画面の JavaScript は `build` と同じものを差し込む。ワークスペースへ書き込む操作は画面に出さない
  - item: 通信
    constraint: スクリプトも書き出した HTML も通信しない
  - item: 起動
    constraint: 起動した Python に依存が無ければ、スキル専用の仮想環境の Python で起動し直す（『コマンドの起動』）
refs:
  - dev/設計書/インターフェース定義/スクリプト/プレビューの書き出し#
  - dev/設計書/インターフェース定義/プレビュー/プレビューを開く#
  - dev/設計書/シナリオ/単一ユースケース/プレビューを配る#
notes:
  build と分ける理由: '#13 で `build` を無くしても、配る書き出しは残すと決めている。別のコマンドにしておき、`build` を消すときに手戻りを出さない'
  書き出す先を既定にしない理由: ワークスペースの `release/` はゴール判定のたびに `clear-release` が中身を消すため、既定の置き場所にすると配る書き出しが消える。置き場所は利用者が渡したい先で決まるので、`--out` を必須にして `session` が利用者に聞く
