title: "項目の検索"
entry:
  kind: operation
  value: '`python3 {スキルのフォルダ}/scripts/mindmap.py find`（コマンドの引数・標準出力・終了コード）。起動の仕方は『コマンドの起動』'
flows:
  - name: 正常系
    summary: 文字と属性で探し、両方に合う項目だけを返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 次の項目を持つワークスペース
        notes: 'D-1: タイトルに `スキーマ`・属性 `担当: 自分`／D-2: 案の `content` にだけ `スキーマ`・属性なし／T-1: どの欄にも `スキーマ` を含まず属性 `担当: 自分`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py find
        participant WS as ワークスペース

        クライアント->>IF: find --workspace --text スキーマ --attr 担当=自分
        IF-->>WS: 全ての YAML を読む
        IF-->>クライアント: JSON（items）
      ```
    expected:
      - 終了コードが 0
      - '`items` が D-1 の 1 件だけ'
    test: test_normal
  - name: 正常系（入れ子の文字に当たる）
    summary: 文字だけで探すと、案の中身に含む項目も返す
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: make_workspace
        description: 正常系と同じワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py find
        participant WS as ワークスペース

        クライアント->>IF: find --workspace --text スキーマ
        IF-->>WS: 全ての YAML を読む
        IF-->>クライアント: JSON（items）
      ```
    expected:
      - 終了コードが 0
      - '`items` が D-1・D-2 の順で、T-1 が無い'
    test: test_normal_when_nested_text
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（実際の Python で起動する）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as mindmap.py find
        participant WS as フォルダ

        クライアント->>IF: find --workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: エラー、終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーにフォルダのパスがある
    test: test_error_when_workspace_not_found
lead: 文字・種類・状態・タグ・対象・カテゴリー・フェーズ・属性の条件に合う項目を返す。
idempotent: true
side_effects: なし（読むだけ）
request:
  - name: --workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
  - name: --text
    type: str
    required: false
    default: なし（文字で絞らない）
    location: argument
    description: 項目の文字の欄（入れ子の `options[]` なども含む、YAML の全ての文字列の値）のどれかに含まれる文字。英字の大小を区別しない
    notes: '`docs/` の本文は探さない'
  - name: --kind
    type: '"decision" | "task" | "research" | "doc" | "term" | "note" | "log"'
    required: false
    default: なし（全ての種類）
    location: argument
    description: 種類
  - name: --status
    type: str
    required: false
    default: なし
    location: argument
    description: 状態が一致する項目
  - name: --tag
    type: str
    required: false
    default: なし
    location: argument
    description: タグに持つ項目
  - name: --target
    type: str
    required: false
    default: なし
    location: argument
    description: 対象が一致する項目
  - name: --category
    type: str
    required: false
    default: なし
    location: argument
    description: カテゴリーが一致する項目
  - name: --phase
    type: str
    required: false
    default: なし
    location: argument
    description: フェーズが一致する項目
  - name: --attr
    type: str
    required: false
    default: なし
    location: argument
    description: '`名前=値` の形で、属性が一致する項目。繰り返し渡せる（全てに合うもの）。`名前` だけならその属性を持つ項目'
    example: 担当=自分
response:
  - name: items[].id
    type: str
    description: 合った項目の ID（種類の順 D・T・R・A・G・N・L、連番の小さい順）
  - name: items[].kind
    type: str
    description: 種類（`--kind` と同じ値）
  - name: items[].title
    type: str
    description: タイトル
  - name: items[].status
    type: str | None
    description: 状態（状態を持たない種類は `null`）
exceptions:
  - name: なし（正常終了）
    condition: 探せた（合う項目が 0 件のときも含む）
    notes: 終了コード 0
  - name: WorkspaceNotFoundError
    condition: '`--workspace` のフォルダに `mindmap.yaml` が無い'
    notes: 終了コード 1
error_format: '標準エラーに `エラー: {内容}` の行を出す。'
constraints:
  - item: 出力の形
    constraint: 標準出力に JSON を 1 個（UTF-8、日本語はエスケープしない）
  - item: 終了コード
    constraint: 0 正常 / 1 実行時のエラー / 2 引数の誤り
  - item: 条件の組み合わせ
    constraint: 渡した条件の全てに合う項目。条件を 1 つも渡さなければ全ての項目
  - item: 件数
    constraint: 制限なし
test_file: tests/integration/scripts/test_find.py
