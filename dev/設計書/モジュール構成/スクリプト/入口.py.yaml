  - name: merge_changes
    title: 変更の当てはめ
    kind: 関数
    container: skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: 渡したキーを値ごと置き換え、`null` のキーを消した新しい項目を返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 元の項目（書き換えない）
      - name: changes
        type: dict[str, Any]
        required: true
        passing: positional
        description: 置き換えるキーと値（`body_markdown` を除いたもの）
    returns:
      type: tuple[dict[str, Any], list[str]]
      description: 新しい項目と、値が変わった・消えたキー（渡した順）
    process: |-
      1. 元の項目を写し、渡したキーごとに当てはめる
         - 値が `None` の場合、キーがあれば消して変わったキーに加える
         - それ以外で元の値と違う場合、置き換えて変わったキーに加える（新しいキーは末尾に足す）
    unit_tests:
      - name: test_merge_changes
        case: 正常
        summary: 置き換え・消す・同じ値を見分ける
        condition: '元 `{"id": "D-1", "status": "未決定", "weight": "大", "lead": "l"}` に `{"status": "決定済み", "weight": null, "lead": "l", "answer": "a"}`'
        mock: なし
        expected: '`{"id": "D-1", "status": "決定済み", "lead": "l", "answer": "a"}` と `[status, weight, answer]`。元の項目は変わらない'
  - name: switch_adopted
    title: 採用する案の切り替え
    kind: 関数
    container: skills/mindmap/scripts/commands.py
    usecase: 採用する案の切り替え
    scope: public
    summary: 指定した記号の案だけを採用にした新しい項目を返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 検討事項（書き換えない）
      - name: key
        type: str
        required: true
        passing: positional
        description: 採用する案の記号
    returns:
      type: tuple[dict[str, Any], str | None]
      description: 新しい項目と、それまで採用していた案の記号（無ければ `None`）
    process: |-
      1. `options` にその記号の案が無ければ `OptionNotFoundError`（持っている記号の一覧つき）を送る
      2. それまで `adopted` が真だった最初の案の記号を控える
      3. 指定した案の `adopted` を真、ほかを偽にした新しい項目を返す
    exceptions:
      - name: OptionNotFoundError
        condition: 検討事項がその記号の案を持たない（`options` が無いときも含む）
        message: '案がありません: {key}（持っている案: {記号の一覧}）'
    unit_tests:
      - name: test_switch_adopted
        case: 正常
        summary: 採用を切り替え、前の記号を返す
        condition: 案 A（採用）・案 B を持つ項目と `B`
        mock: なし
        expected: '案 A `adopted: false`・案 B `adopted: true` の項目と `A`'
      - name: test_switch_adopted_when_none_adopted
        case: 正常
        summary: 採用が無ければ前の記号は None
        condition: どの案も採用していない項目と `A`
        mock: なし
        expected: '案 A だけ `adopted: true` の項目と `None`'
      - name: test_switch_adopted_when_option_missing
        case: 異常
        summary: 無い記号は切り替えない
        condition: 案 A・B を持つ項目と `Z`
        mock: なし
        expected: '`OptionNotFoundError`（メッセージに `Z`・`A`・`B`）'
        exception: その記号の案を持たない
