title: "スクリプト / 入口"
lead: コマンドの引数を解釈して各機能へ振り分け、結果を JSON・エラーを標準エラーと終了コードにする。依存の確認だけは PyYAML・jsonschema を読まずに済ませる。
directory: |-
  ```
  skills/mindmap/scripts/
    mindmap.py    入口（引数の解釈・振り分け・出力。Python 3.8 で読める構文）
    check_env.py  依存の確認（Python 3.8 で読める構文）
    commands.py   コマンドごとの処理（標準入力の解釈 → 各機能 → 出力の辞書）
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 入口
        class 依存の確認
        class コマンドの処理
        class 読み書きと検証
        class 検索
        class 依存と影響
        class 点検
        class ビルド
        入口 --> 依存の確認 : check-env
        入口 --> コマンドの処理 : それ以外（遅延 import）
        コマンドの処理 --> 読み書きと検証
        コマンドの処理 --> 検索
        コマンドの処理 --> 依存と影響
        コマンドの処理 --> 点検
        コマンドの処理 --> ビルド
        検索 --> 読み書きと検証
        依存と影響 --> 読み書きと検証
        点検 --> 読み書きと検証
        ビルド --> 読み書きと検証
      ```
classes:
  - name: PythonVersionError
    title: Python が古い
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    summary: 仮想環境の Python の版が下限より古いか、版を引けない。依存の確認の結果を持ち、入口がそれを標準出力に出して終了コード 1 にする
    kind: クラス
    inherits: Exception
    properties:
      - name: report
        type: dict
        description: 依存の確認の結果
  - name: DependencyMissingError
    title: 依存が足りない
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    summary: ライブラリが無いか下限より古い。依存の確認の結果を持つ
    kind: クラス
    inherits: Exception
    properties:
      - name: report
        type: dict
        description: 依存の確認の結果
  - name: VenvNotFoundError
    title: 仮想環境が無い
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    summary: 仮想環境の Python が無い。依存の確認の結果を持つ
    kind: クラス
    inherits: Exception
    properties:
      - name: report
        type: dict
        description: 依存の確認の結果
constants:
  - name: MIN_PYTHON
    title: Python の版の下限
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    summary: 非機能要件の「Python の版」
    value: (3, 12)
  - name: REQUIREMENTS
    title: ライブラリの版の下限
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    summary: 配布名 → 版の下限（外部ライブラリの設計書の版）
    entries:
      - key: PyYAML
        value: '5.1'
      - key: jsonschema
        value: 4.18.0
  - name: RESERVED_KEYS
    title: スクリプトが付けるキー
    container: skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: 標準入力で渡させないキー
    value: ("id", "created", "updated", "body")
  - name: BODY_INPUT_KEY
    title: 本文を渡すキー
    container: skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: 標準入力で本文の Markdown を渡すキー（YAML には残さない）
    value: '"body_markdown"'
  - name: PROBE_SCRIPT
    title: 仮想環境への問い合わせ
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    summary: 仮想環境の Python に `-c` で渡すコード。版と `REQUIREMENTS` の配布名ごとの版（`importlib.metadata.version`。無ければ `null`）を JSON で標準出力に出す。`importlib.metadata` を読めない版では全て `null`
    value: str
functions:
  - name: main
    title: 入口
    kind: 関数
    container: skills/mindmap/scripts/mindmap.py
    usecase: 共通
    scope: public
    summary: 引数を解釈してコマンドを実行し、出力と終了コードを決める
    description: ファイルの先頭に `from __future__ import annotations` を置き、Python 3.8 で読める構文だけで書く（`type` 文・`match` 文を使わない）。末尾で `sys.exit(main())`。
    side_effects: 標準出力・標準エラーに書く
    args:
      - name: argv
        type: list[str] | None
        required: false
        default: None
        passing: positional
        description: 引数（`None` なら `sys.argv[1:]`）
    returns:
      type: int
      description: 終了コード（0 正常 / 1 実行時のエラー・点検で問題あり / 2 引数の誤りは argparse が終える）
    process: |-
      1. 引数を解釈する（`build_parser`）
      2. コマンドで分ける
         - `check-env` の場合、`--venv` の仮想環境を確かめる（`run_check_env`）。`VenvNotFoundError`・`PythonVersionError`・`DependencyMissingError` は `report` を標準出力に出して 1 を返す
         - それ以外の場合、`commands` をここで import し、コマンドの関数を呼ぶ（標準入力を使うコマンドは `sys.stdin.read()` を渡す）
      3. 結果を `json.dumps(ensure_ascii=False)` で標準出力に出し、コマンドが返した終了コードを返す
      4. `MindmapError` を捕まえたら、標準エラーに `エラー: {メッセージ}` と `lines` を出して 1 を返す（標準出力には何も出さない）
    unit_tests:
      - name: test_main_when_check_env
        case: 正常
        summary: check-env は commands を読まずに結果を出す
        condition: '`run_check_env` を、揃っている結果を返す関数に差し替える。`sys.modules` から `commands` を除いておく'
        mock: '`run_check_env`'
        expected: 0 を返し、標準出力がその結果の JSON。`commands` が `sys.modules` に無い
      - name: test_main_when_dependency_missing
        case: 正常
        summary: 依存が足りなければ結果を出して 1
        condition: '`run_check_env` を `DependencyMissingError(report)` を送る関数に差し替える'
        mock: '`run_check_env`'
        expected: 1 を返し、標準出力が `report` の JSON
      - name: test_main_when_mindmap_error
        case: 正常
        summary: コマンドのエラーは標準エラーと 1
        condition: '`mindmap.yaml` が無い `tmp_path` で `status --workspace`'
        mock: なし
        expected: '1 を返し、標準エラーが `エラー: ` で始まりパスを含む。標準出力が空'
      - name: test_main
        case: 正常
        summary: コマンドの結果を JSON で出す
        condition: 作成済みのワークスペースで `attrs --workspace`
        mock: なし
        expected: '0 を返し、標準出力が `{"attrs": []}`'
  - name: build_parser
    title: 引数の定義
    kind: 関数
    container: skills/mindmap/scripts/mindmap.py
    usecase: 共通
    scope: public
    summary: 13 のコマンドと引数を持つ `ArgumentParser` を作る
    returns:
      type: argparse.ArgumentParser
      description: サブコマンドを持つ引数の定義（引数は各インターフェース定義のリクエストのとおり）
    process: |-
      1. `check-env` に `--venv`（省略時 `default_venv_dir()`）、それ以外のサブコマンドに `--workspace`（必須）を持たせる
      2. `add` は `kind`（`KINDS` のキー）、`update`・`impact`・`show` は `id`、`adopt` は `id` と `key`、`next` は `--limit`（1 以上の整数）、`find` は `--text`・`--kind`・`--status`・`--tag`・`--target`・`--category`・`--phase`・`--attr`（繰り返し）を持たせる
    unit_tests:
      - name: test_build_parser
        case: 正常
        summary: 繰り返しの --attr と位置引数を解釈する
        condition: '`find --workspace w --attr a=1 --attr b`・`adopt D-1 B --workspace w`'
        mock: なし
        expected: '`attr` が `[a=1, b]`、`id` が `D-1`・`key` が `B`'
      - name: test_build_parser_when_limit_invalid
        case: 異常
        summary: 1 より小さい --limit は引数の誤り
        condition: '`next --workspace w --limit 0`'
        mock: なし
        expected: '`SystemExit`（コード 2）'
  - name: run_check_env
    title: 依存の確認
    kind: 関数
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    scope: public
    summary: 仮想環境の Python の版とライブラリの版を確かめ、足りなければ結果を持った例外を送る
    description: ファイルの先頭に `from __future__ import annotations` を置き、Python 3.8 で読める構文だけで書く。
    args:
      - name: venv_dir
        type: Path
        required: true
        passing: positional
        description: 確かめる仮想環境のフォルダ（`--venv`）
      - name: probe
        type: Callable[[Path], dict | None]
        required: false
        default: probe_venv
        passing: injected
        description: 仮想環境の Python に版とライブラリの版を尋ねる関数
      - name: base_python
        type: str
        required: false
        default: sys.executable
        passing: keyword
        description: 仮想環境を作る Python（`check-env` を動かしている Python）
      - name: base_version
        type: tuple[int, ...]
        required: false
        default: sys.version_info
        passing: keyword
        description: 仮想環境を作る Python の版
    returns:
      type: dict
      description: 依存の確認の結果（インターフェース定義『依存の確認』のレスポンスの形）
    process: |-
      1. `base_version` が `MIN_PYTHON` 以上かを `base_python_ok` にし、`base_python`・`base_python_version` と一緒に結果へ載せる
      2. 仮想環境の Python の場所を引く（`venv_python_path`）
      3. その Python が無い場合、`venv_ok: false`・`python: null`・全ての `installed: null` と、作って入れるコマンド（`build_install_command` の `create`。`base_python_ok` が偽なら `null`）を持った `VenvNotFoundError(report)` を送る
      4. `probe` で版とライブラリの版を尋ねる
         - `None` が返った場合、版を引けないものとして `python: null`・`python_ok: false` にする
         - それ以外は、版が `MIN_PYTHON` 以上かを `python_ok` にする（`parse_version`）
      5. `REQUIREMENTS` の配布名ごとに入っている版と下限を比べる（`parse_version`。`null` なら `ok: false`）
      6. 結果を判定する
         - `python_ok` が偽の場合、作り直して入れるコマンド（`recreate`。`base_python_ok` が偽なら `null`）を持った `PythonVersionError(report)` を送る
         - 足りないライブラリがある場合、足りないものを入れるコマンド（`install`）を持った `DependencyMissingError(report)` を送る
         - それ以外は `install: null` の結果を返す
    exceptions:
      - name: VenvNotFoundError
        condition: 仮想環境の Python が無い
      - name: PythonVersionError
        condition: 仮想環境の Python の版が `MIN_PYTHON` より古いか、版を引けない
      - name: DependencyMissingError
        condition: 仮想環境の Python の版は足りていて、どれかのライブラリが無いか下限より古い
    unit_tests:
      - name: test_run_check_env
        case: 正常
        summary: そろっていれば結果を返す
        condition: '`tmp_path` に仮想環境の Python の場所だけファイルを置き、`probe` は `python: 3.12.3`・PyYAML `6.0.3`・jsonschema `4.26.0` を返す'
        mock: '`probe`'
        expected: '`venv_ok: true`・`python_ok: true`、両方 `ok: true`、`python_path` がその Python、`install: null`'
      - name: test_run_check_env_when_venv_missing
        case: 異常
        summary: 仮想環境が無ければ VenvNotFoundError
        condition: '`tmp_path` の下のまだ無いフォルダ'
        mock: '`probe`（呼ばれないことを確かめる）'
        expected: '`VenvNotFoundError`（`report` の `venv_ok: false`・`python: null`・全ての `installed: null`、`install` に `-m venv`）。`probe` が呼ばれない'
        exception: 仮想環境が無い
      - name: test_run_check_env_when_python_old
        case: 異常
        summary: 仮想環境の Python が古いか版を引けなければ PythonVersionError
        condition: '`parametrize`: `probe` が `python: 3.9.6` を返す / `None` を返す'
        mock: '`probe`'
        expected: '`PythonVersionError`（`report` の `python_ok: false`、`python` が `3.9.6` / `null`、`install` に `--clear`）'
        exception: Python の版が古い・引けない
      - name: test_run_check_env_when_package_missing
        case: 異常
        summary: 無い・古いライブラリがあれば DependencyMissingError
        condition: '`probe` は `python: 3.12.3`、PyYAML `null`、jsonschema `4.17.3` を返す'
        mock: '`probe`'
        expected: '`DependencyMissingError`（`report` の PyYAML `installed: null`・`ok: false`、jsonschema `ok: false`、`install` に `PyYAML>=5.1` と `jsonschema>=4.18.0` があり `-m venv` が無い）'
        exception: ライブラリが無いか古い
      - name: test_run_check_env_when_old_syntax
        case: 正常
        summary: 入口と依存の確認のファイルが Python 3.8 の構文で読め、型注釈を実行時に評価しない
        condition: '`mindmap.py`・`check_env.py` を `ast.parse(..., feature_version=(3, 8))` で読み、先頭の文を見る'
        mock: なし
        expected: どちらも `SyntaxError` にならず、docstring の次の文が `from __future__ import annotations`
      - name: test_run_check_env_when_base_python_old
        case: 異常
        summary: 仮想環境を作る Python が古ければ、作る・作り直すコマンドを返さない
        condition: '`base_version=(3, 9, 6)`。`parametrize`: 仮想環境が無い / `probe` が `python: 3.9.6` を返す'
        mock: '`probe`'
        expected: '`VenvNotFoundError` / `PythonVersionError` で、`report` の `base_python_ok: false`・`base_python_version: 3.9.6`・`install: null`'
        exception: 仮想環境を作る Python が古い
  - name: parse_version
    title: 版の解釈
    kind: 関数
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    scope: public
    summary: 版の文字列を比べられる整数の組にする
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 版（例 `6.0.3`・`4.18.0rc1`）
    returns:
      type: tuple[int, ...]
      description: '`.` で区切った各部分の先頭の数字（数字が無い部分で打ち切る）'
    process: 1. `.` で分け、各部分の先頭の数字を整数にする。先頭が数字でない部分が出たらそこで打ち切る
    unit_tests:
      - name: test_parse_version
        case: 正常
        summary: 数字の組にする
        condition: '`parametrize`: `6.0.3` / `4.18.0rc1` / `5.1`'
        mock: なし
        expected: '`(6, 0, 3)` / `(4, 18, 0)` / `(5, 1)`'
  - name: build_install_command
    title: そろえるコマンド
    kind: 関数
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    scope: public
    summary: 仮想環境とライブラリをそろえる 1 行のコマンドを作る
    args:
      - name: mode
        type: '"create" | "recreate" | "install"'
        required: true
        passing: positional
        description: 仮想環境を作る / 作り直す / ライブラリだけ入れる
      - name: missing
        type: list[str]
        required: true
        passing: positional
        description: 入れる配布名（`REQUIREMENTS` の順）
      - name: venv_dir
        type: Path
        required: true
        passing: keyword
        description: 仮想環境のフォルダ
      - name: base_python
        type: str
        required: true
        passing: keyword
        description: 仮想環境を作る Python
      - name: os_name
        type: str
        required: false
        default: os.name
        passing: keyword
        description: '`venv_python_path` へ渡す OS の名前'
    returns:
      type: str | None
      description: パスと `{名前}>={下限}` を二重引用符で囲み、`&&` でつないだコマンド。入れるものが無ければ `None`
    process: |-
      1. `install` で `missing` が空なら `None` を返す
      2. `create` は `"{base_python}" -m venv "{venv_dir}"`、`recreate` は `"{base_python}" -m venv --clear "{venv_dir}"` を先頭に置き、`&&` でつなぐ
      3. 仮想環境の Python（`venv_python_path`）で `-m pip install` し、`missing` の配布名ごとに `"{名前}>={下限}"` を並べる
    unit_tests:
      - name: test_build_install_command
        case: 正常
        summary: 作る・作り直す・入れるだけを分ける
        condition: '`parametrize`: `create` と `["PyYAML", "jsonschema"]` / `recreate` と同じ / `install` と `["jsonschema"]`。`venv_dir=/v`・`base_python=/usr/bin/python3`・`os_name="posix"`'
        mock: なし
        expected: '`"/usr/bin/python3" -m venv "/v" && "/v/bin/python" -m pip install "PyYAML>=5.1" "jsonschema>=4.18.0"` / `-m venv --clear "/v"` で始まる同じ形 / `"/v/bin/python" -m pip install "jsonschema>=4.18.0"`'
      - name: test_build_install_command_when_none_missing
        case: 正常
        summary: 入れるものが無ければ None
        condition: '`install` と `[]`'
        mock: なし
        expected: '`None`'
  - name: read_json_object
    title: 標準入力の解釈
    kind: 関数
    container: skills/mindmap/scripts/commands.py
    usecase: 共通
    scope: public
    summary: 標準入力を JSON のオブジェクトとして読む
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 標準入力の中身
    returns:
      type: dict[str, Any]
      description: 読んだオブジェクト
    process: |-
      1. `json.loads` で読む
         - 読めない場合、`SchemaMismatchError`（`標準入力: (全体): JSON として読めません`）を送る
         - オブジェクトでない場合、`SchemaMismatchError`（`標準入力: (全体): オブジェクトではありません`）を送る
    exceptions:
      - name: SchemaMismatchError
        condition: JSON として読めない
      - name: SchemaMismatchError
        condition: JSON のオブジェクトでない
    unit_tests:
      - name: test_read_json_object
        case: 正常
        summary: オブジェクトを読む
        condition: '`{"title": "問い"}`'
        mock: なし
        expected: '`{"title": "問い"}`'
      - name: test_read_json_object_when_invalid
        case: 異常
        summary: 読めない・オブジェクトでない入力
        condition: '`parametrize`: `{` / `[1]`'
        mock: なし
        expected: '`SchemaMismatchError`'
        exception: JSON として読めない・オブジェクトでない
  - name: validate_input_keys
    title: 渡せないキーの確認
    kind: 関数
    container: skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: スクリプトが付けるキーと、本文を持てない種類への `body_markdown` を弾く
    args:
      - name: kind
        type: Kind
        required: true
        passing: positional
        description: 種類
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 標準入力のオブジェクト
    process: |-
      1. `RESERVED_KEYS` のキーがあれば `SchemaMismatchError`（`標準入力: {キー}: スクリプトが付けるキーです`）を送る
      2. `body_markdown` があり、`KINDS[kind].has_body` が偽なら `SchemaMismatchError` を送る
    exceptions:
      - name: SchemaMismatchError
        condition: '`id`・`created`・`updated`・`body` のどれかを持つ'
      - name: SchemaMismatchError
        condition: 本文を持てない種類に `body_markdown` を持つ
    unit_tests:
      - name: test_validate_input_keys
        case: 正常
        summary: 渡せるキーだけなら何もしない
        condition: '`decision` に `{"title": "t", "body_markdown": "b"}`'
        mock: なし
        expected: 例外を送らない
      - name: test_validate_input_keys_when_reserved
        case: 異常
