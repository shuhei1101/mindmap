    kind: 関数
    container: skills/mindmap/scripts/check_env.py
    usecase: ワークスペースの作成
    scope: public
    summary: 仮想環境の Python を子プロセスで起動し、版とライブラリの版を受け取る
    side_effects: 子プロセスを起動する
    args:
      - name: python_path
        type: Path
        required: true
        passing: positional
        description: 仮想環境の Python
      - name: run
        type: Callable[..., subprocess.CompletedProcess]
        required: false
        default: subprocess.run
        passing: injected
        description: 子プロセスを起動する関数
    returns:
      type: dict | None
      description: '`{python: 版, packages: {配布名: 版 | None}}`。起動できないか、終了コードが 0 でないか、出力を JSON として読めなければ `None`'
    process: |-
      1. `[str(python_path), "-c", PROBE_SCRIPT]` を配列のまま渡して起動する（シェルを通さない。標準出力を受け取る）
      2. 終了コードが 0 なら標準出力を JSON として読んで返し、それ以外（`OSError` を含む）は `None` を返す
    unit_tests:
      - name: test_probe_venv
        case: 正常
        summary: テストを動かす Python に尋ねる
        condition: '`sys.executable` を渡す'
        mock: なし
        expected: '`python` が `platform.python_version()` と同じで、`packages` に PyYAML・jsonschema のキーがある'
      - name: test_probe_venv_when_failed
        case: 異常
        summary: 起動できないか出力が読めなければ None
        condition: '`parametrize`: `run` が `OSError` を送る / 終了コード 1 を返す / 標準出力 `x` を返す'
        mock: '`run`'
        expected: '`None`'
notes:
  モジュールの読み込み: スクリプトはパッケージとして入れず、`check-env` はシステムの `python3`、それ以外は仮想環境の Python（`check-env` が返す `python_path`）で `{スキルのフォルダ}/scripts/mindmap.py` を起動する。起動したファイルのフォルダが `sys.path` の先頭に入るので、各モジュールは `import store` のように同じフォルダの名前で読む。単体テストは `tests/unit/scripts/conftest.py` で `skills/mindmap/scripts` を `sys.path` に足して同じ名前で読む。
  入口の構文: '`mindmap.py` と `check_env.py` は先頭に `from __future__ import annotations` を置き、型注釈を実行時に評価しない（`X | Y` の型注釈が 3.9 以前で読み込み時に落ちない）。`commands.py` より先のモジュールは、`check-env` を通った後にだけ読むので 3.12 の書き方を使ってよい。'
