<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プレビュー</title>
</head>
<body>
  <!-- 見出し -->
  <h1>プレビュー</h1>

  <!-- 件数: 下の script が mindmap-data を読んで、種類ごとの件数を並べる -->
  <ul id="counts"></ul>

  <!-- 埋め込み先: build が記録の JSON をここへ入れる。この要素は雛形にちょうど 1 つだけ置く -->
  <script type="application/json" id="mindmap-data"></script>

  <!-- 件数の表示。画面の中身は別の作業が、この雛形を差し替えて作る -->
  <script>
    // 種類ごとのキーと表示名
    const KIND_LABELS = [
      ["decisions", "検討事項"],
      ["tasks", "タスク"],
      ["research", "調査"],
      ["docs", "資料"],
      ["terms", "用語集"],
      ["notes", "メモ"],
      ["logs", "会話ログ"],
    ];
    const data = JSON.parse(document.getElementById("mindmap-data").textContent);
    const list = document.getElementById("counts");
    for (const [key, label] of KIND_LABELS) {
      const item = document.createElement("li");
      item.textContent = `${label}: ${data[key].length} 件`;
      list.append(item);
    }
  </script>
</body>
</html>
